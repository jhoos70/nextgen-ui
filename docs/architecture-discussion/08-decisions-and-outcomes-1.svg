<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family='Inter, "Segoe UI", Helvetica, Arial, sans-serif'><defs><marker id="a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker></defs><rect width="1600" height="900" fill="#ffffff"/><text x="40" y="52" font-size="30" font-weight="700" fill="#1f2937">8  Decisions of the migration phase and their outcome (1 of 2)</text><text x="40" y="82" font-size="16" fill="#5b6472">The foundations, decided 2026-10-31 and in the modernizer's October plan. Status as of 2026-11-08.</text><rect x="40" y="104" width="300" height="36" rx="8" fill="#0f172a"/><text x="52" y="128" font-size="14.5" font-weight="700" fill="#ffffff" text-anchor="start">Decision</text><rect x="348" y="104" width="300" height="36" rx="8" fill="#0f172a"/><text x="360" y="128" font-size="14.5" font-weight="700" fill="#ffffff" text-anchor="start">Why</text><rect x="656" y="104" width="640" height="36" rx="8" fill="#0f172a"/><text x="668" y="128" font-size="14.5" font-weight="700" fill="#ffffff" text-anchor="start">Outcome (what we know)</text><rect x="1304" y="104" width="210" height="36" rx="8" fill="#0f172a"/><text x="1316" y="128" font-size="14.5" font-weight="700" fill="#ffffff" text-anchor="start">Verdict</text><rect x="40" y="148" width="300" height="92" rx="8" fill="#f8fafc" stroke="#c9d1dc" stroke-width="1.5"/><text x="52" y="172.0" font-size="13.5" font-weight="700" fill="#1f2937" text-anchor="start">Refactor in place (modernizer, Oct</text><text x="52" y="189.55" font-size="13.5" font-weight="700" fill="#1f2937" text-anchor="start">2026)</text><rect x="348" y="148" width="300" height="92" rx="8" fill="#ffffff" stroke="#c9d1dc" stroke-width="1.5"/><text x="360" y="172.0" font-size="13.5" font-weight="400" fill="#1f2937" text-anchor="start">v1 contract frozen, ReGa and the</text><text x="360" y="189.55" font-size="13.5" font-weight="400" fill="#1f2937" text-anchor="start">interface daemons closed source,</text><text x="360" y="207.1" font-size="13.5" font-weight="400" fill="#1f2937" text-anchor="start">small device, classic UI stays</text><rect x="656" y="148" width="640" height="92" rx="8" fill="#ffffff" stroke="#c9d1dc" stroke-width="1.5"/><text x="668" y="172.0" font-size="13.5" font-weight="400" fill="#1f2937" text-anchor="start">v1 hardened inside upstream's tree (58 method scripts, 18 libraries; 106 files differ</text><text x="668" y="189.55" font-size="13.5" font-weight="400" fill="#1f2937" text-anchor="start">from upstream in all); v2 added beside it; 1,390 Tcl contract tests. The cost showed</text><text x="668" y="207.1" font-size="13.5" font-weight="400" fill="#1f2937" text-anchor="start">at the merge (slide 7). The measurement gate for a gateway was never run until now:</text><text x="668" y="224.65" font-size="13.5" font-weight="400" fill="#1f2937" text-anchor="start">the gap is push.</text><rect x="1304" y="148" width="210" height="92" rx="8" fill="#dcfce7" stroke="#c9d1dc" stroke-width="1.5"/><text x="1316" y="172.0" font-size="13.5" font-weight="700" fill="#1f2937" text-anchor="start">Held; narrow the in-</text><text x="1316" y="189.55" font-size="13.5" font-weight="700" fill="#1f2937" text-anchor="start">place edits</text><rect x="40" y="246" width="300" height="74" rx="8" fill="#f8fafc" stroke="#c9d1dc" stroke-width="1.5"/><text x="52" y="270.0" font-size="13.5" font-weight="700" fill="#1f2937" text-anchor="start">D2  Classic and nextGen side by side</text><text x="52" y="287.55" font-size="13.5" font-weight="700" fill="#1f2937" text-anchor="start">(31 Oct)</text><rect x="348" y="246" width="300" height="74" rx="8" fill="#ffffff" stroke="#c9d1dc" stroke-width="1.5"/><text x="360" y="270.0" font-size="13.5" font-weight="400" fill="#1f2937" text-anchor="start">classic must keep working; OpenCCU's</text><text x="360" y="287.55" font-size="13.5" font-weight="400" fill="#1f2937" text-anchor="start">patches depend on webui.js</text><rect x="656" y="246" width="640" height="74" rx="8" fill="#ffffff" stroke="#c9d1dc" stroke-width="1.5"/><text x="668" y="270.0" font-size="13.5" font-weight="400" fill="#1f2937" text-anchor="start">nextGen lives in /webui/next/. Against current upstream only 2 files of the classic</text><text x="668" y="287.55" font-size="13.5" font-weight="400" fill="#1f2937" text-anchor="start">area differ (utf82ansi.py, hm_deldev). The app merged with 0 conflicts and the CCU3</text><text x="668" y="305.1" font-size="13.5" font-weight="400" fill="#1f2937" text-anchor="start">serves both UIs.</text><rect x="1304" y="246" width="210" height="74" rx="8" fill="#dcfce7" stroke="#c9d1dc" stroke-width="1.5"/><text x="1316" y="270.0" font-size="13.5" font-weight="700" fill="#1f2937" text-anchor="start">Held</text><rect x="40" y="326" width="300" height="74" rx="8" fill="#f8fafc" stroke="#c9d1dc" stroke-width="1.5"/><text x="52" y="350.0" font-size="13.5" font-weight="700" fill="#1f2937" text-anchor="start">D1  Charset: staged UTF-8 (31 Oct)</text><rect x="348" y="326" width="300" height="74" rx="8" fill="#ffffff" stroke="#c9d1dc" stroke-width="1.5"/><text x="360" y="350.0" font-size="13.5" font-weight="400" fill="#1f2937" text-anchor="start">stop silent loss of characters</text><text x="360" y="367.55" font-size="13.5" font-weight="400" fill="#1f2937" text-anchor="start">without changing the served bytes</text><rect x="656" y="326" width="640" height="74" rx="8" fill="#ffffff" stroke="#c9d1dc" stroke-width="1.5"/><text x="668" y="350.0" font-size="13.5" font-weight="400" fill="#1f2937" text-anchor="start">Stage 1 done: the build fails instead of dropping characters; served output unchanged.</text><text x="668" y="367.55" font-size="13.5" font-weight="400" fill="#1f2937" text-anchor="start">Stage 2 (serve UTF-8, regenerate the patches) not started; many of those patches have</text><text x="668" y="385.1" font-size="13.5" font-weight="400" fill="#1f2937" text-anchor="start">since been absorbed upstream.</text><rect x="1304" y="326" width="210" height="74" rx="8" fill="#fef3c7" stroke="#c9d1dc" stroke-width="1.5"/><text x="1316" y="350.0" font-size="13.5" font-weight="700" fill="#1f2937" text-anchor="start">Stage 1 held; stage 2</text><text x="1316" y="367.55" font-size="13.5" font-weight="700" fill="#1f2937" text-anchor="start">open</text><rect x="40" y="406" width="300" height="74" rx="8" fill="#f8fafc" stroke="#c9d1dc" stroke-width="1.5"/><text x="52" y="430.0" font-size="13.5" font-weight="700" fill="#1f2937" text-anchor="start">D3 / D4  Open source only; React,</text><text x="52" y="447.55" font-size="13.5" font-weight="700" fill="#1f2937" text-anchor="start">TypeScript, Vite, shadcn (31 Oct)</text><rect x="348" y="406" width="300" height="74" rx="8" fill="#ffffff" stroke="#c9d1dc" stroke-width="1.5"/><text x="360" y="430.0" font-size="13.5" font-weight="400" fill="#1f2937" text-anchor="start">licence fit with Apache-2.0; a spike</text><text x="360" y="447.55" font-size="13.5" font-weight="400" fill="#1f2937" text-anchor="start">ran clean</text><rect x="656" y="406" width="640" height="74" rx="8" fill="#ffffff" stroke="#c9d1dc" stroke-width="1.5"/><text x="668" y="430.0" font-size="13.5" font-weight="400" fill="#1f2937" text-anchor="start">13.7k lines of TypeScript, 14 pages, one 718 kB bundle (203 kB gzipped; the spike</text><text x="668" y="447.55" font-size="13.5" font-weight="400" fill="#1f2937" text-anchor="start">measured 91 kB for React alone), 219 unit tests, 19 browser suites. A full licence</text><text x="668" y="465.1" font-size="13.5" font-weight="400" fill="#1f2937" text-anchor="start">scan of all dependencies was started and not finished.</text><rect x="1304" y="406" width="210" height="74" rx="8" fill="#dcfce7" stroke="#c9d1dc" stroke-width="1.5"/><text x="1316" y="430.0" font-size="13.5" font-weight="700" fill="#1f2937" text-anchor="start">Held; finish the licence</text><text x="1316" y="447.55" font-size="13.5" font-weight="700" fill="#1f2937" text-anchor="start">scan</text><rect x="40" y="486" width="300" height="57" rx="8" fill="#f8fafc" stroke="#c9d1dc" stroke-width="1.5"/><text x="52" y="510.0" font-size="13.5" font-weight="700" fill="#1f2937" text-anchor="start">D5  Routing: /webui/next/ and</text><text x="52" y="527.55" font-size="13.5" font-weight="700" fill="#1f2937" text-anchor="start">/api/homematic.cgi/v2 (31 Oct)</text><rect x="348" y="486" width="300" height="57" rx="8" fill="#ffffff" stroke="#c9d1dc" stroke-width="1.5"/><text x="360" y="510.0" font-size="13.5" font-weight="400" fill="#1f2937" text-anchor="start">no change to OpenCCU's packaging repo</text><text x="360" y="527.55" font-size="13.5" font-weight="400" fill="#1f2937" text-anchor="start">or its lighttpd config</text><rect x="656" y="486" width="640" height="57" rx="8" fill="#ffffff" stroke="#c9d1dc" stroke-width="1.5"/><text x="668" y="510.0" font-size="13.5" font-weight="400" fill="#1f2937" text-anchor="start">Works on the CCU3. Costs: long URLs, one process start per request (about 80 ms), and</text><text x="668" y="527.55" font-size="13.5" font-weight="400" fill="#1f2937" text-anchor="start">a push channel would need a proxy rule. Clean URLs (route A) not done.</text><rect x="1304" y="486" width="210" height="57" rx="8" fill="#dcfce7" stroke="#c9d1dc" stroke-width="1.5"/><text x="1316" y="510.0" font-size="13.5" font-weight="700" fill="#1f2937" text-anchor="start">Held; route A open</text><rect x="40" y="549" width="300" height="57" rx="8" fill="#f8fafc" stroke="#c9d1dc" stroke-width="1.5"/><text x="52" y="573.0" font-size="13.5" font-weight="700" fill="#1f2937" text-anchor="start">D6  Object-centric navigation, no</text><text x="52" y="590.55" font-size="13.5" font-weight="700" fill="#1f2937" text-anchor="start">global Save (31 Oct)</text><rect x="348" y="549" width="300" height="57" rx="8" fill="#ffffff" stroke="#c9d1dc" stroke-width="1.5"/><text x="360" y="573.0" font-size="13.5" font-weight="400" fill="#1f2937" text-anchor="start">the classic menu shows six nouns</text><text x="360" y="590.55" font-size="13.5" font-weight="400" fill="#1f2937" text-anchor="start">twice; dialogs save themselves</text><rect x="656" y="549" width="640" height="57" rx="8" fill="#ffffff" stroke="#c9d1dc" stroke-width="1.5"/><text x="668" y="573.0" font-size="13.5" font-weight="400" fill="#1f2937" text-anchor="start">A drift test against the classic menu files caught upstream's new script-executor</text><text x="668" y="590.55" font-size="13.5" font-weight="400" fill="#1f2937" text-anchor="start">entry at the merge. Not built yet: diagrams, direct links, device inbox, scripts.</text><rect x="1304" y="549" width="210" height="57" rx="8" fill="#dcfce7" stroke="#c9d1dc" stroke-width="1.5"/><text x="1316" y="573.0" font-size="13.5" font-weight="700" fill="#1f2937" text-anchor="start">Held</text><rect x="40" y="612" width="300" height="74" rx="8" fill="#f8fafc" stroke="#c9d1dc" stroke-width="1.5"/><text x="52" y="636.0" font-size="13.5" font-weight="700" fill="#1f2937" text-anchor="start">D7  The new UI writes, by v2 mutation</text><text x="52" y="653.55" font-size="13.5" font-weight="700" fill="#1f2937" text-anchor="start">routes (31 Oct)</text><rect x="348" y="612" width="300" height="74" rx="8" fill="#ffffff" stroke="#c9d1dc" stroke-width="1.5"/><text x="360" y="636.0" font-size="13.5" font-weight="400" fill="#1f2937" text-anchor="start">nextGen is meant to replace classic</text><text x="360" y="653.55" font-size="13.5" font-weight="400" fill="#1f2937" text-anchor="start">later</text><rect x="656" y="612" width="640" height="74" rx="8" fill="#ffffff" stroke="#c9d1dc" stroke-width="1.5"/><text x="668" y="636.0" font-size="13.5" font-weight="400" fill="#1f2937" text-anchor="start">Built and tested on a restored real ReGa: variables, programs (run, activate, create,</text><text x="668" y="653.55" font-size="13.5" font-weight="400" fill="#1f2937" text-anchor="start">copy, delete, edit actions and conditions, else part), favourites, messages, log,</text><text x="668" y="671.1" font-size="13.5" font-weight="400" fill="#1f2937" text-anchor="start">device values. Fixed server scripts, validation, one syslog line each.</text><rect x="1304" y="612" width="210" height="74" rx="8" fill="#dcfce7" stroke="#c9d1dc" stroke-width="1.5"/><text x="1316" y="636.0" font-size="13.5" font-weight="700" fill="#1f2937" text-anchor="start">Held; the largest</text><text x="1316" y="653.55" font-size="13.5" font-weight="700" fill="#1f2937" text-anchor="start">delivery</text><rect x="40" y="692" width="300" height="57" rx="8" fill="#f8fafc" stroke="#c9d1dc" stroke-width="1.5"/><text x="52" y="716.0" font-size="13.5" font-weight="700" fill="#1f2937" text-anchor="start">Process: no push or PR before tested</text><text x="52" y="733.55" font-size="13.5" font-weight="700" fill="#1f2937" text-anchor="start">end to end</text><rect x="348" y="692" width="300" height="57" rx="8" fill="#ffffff" stroke="#c9d1dc" stroke-width="1.5"/><text x="360" y="716.0" font-size="13.5" font-weight="400" fill="#1f2937" text-anchor="start">origin was a public fork</text><rect x="656" y="692" width="640" height="57" rx="8" fill="#ffffff" stroke="#c9d1dc" stroke-width="1.5"/><text x="668" y="716.0" font-size="13.5" font-weight="400" fill="#1f2937" text-anchor="start">Nothing went to OpenCCU. nextgen-ui lives in your fork, 78 commits since the old base,</text><text x="668" y="733.55" font-size="13.5" font-weight="400" fill="#1f2937" text-anchor="start">3 betas on 2026-11-01. Whether to offer the API hardening upstream is open.</text><rect x="1304" y="692" width="210" height="57" rx="8" fill="#dcfce7" stroke="#c9d1dc" stroke-width="1.5"/><text x="1316" y="716.0" font-size="13.5" font-weight="700" fill="#1f2937" text-anchor="start">Held for OpenCCU;</text><text x="1316" y="733.55" font-size="13.5" font-weight="700" fill="#1f2937" text-anchor="start">upstreaming open</text><text x="40" y="869" font-size="12.5" font-weight="400" fill="#5b6472" text-anchor="start">Sources: .migration/plan/decisions-ui.md, .migration/webui-api/architect/target-architecture.adr.md, the git history of nextgen-ui (78 commits since 5b8179c4), the test suites and the installs of</text><text x="40" y="886" font-size="12.5" font-weight="400" fill="#5b6472" text-anchor="start">2026-11-08.</text></svg>
