<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family='Inter, "Segoe UI", Helvetica, Arial, sans-serif'><defs><marker id="a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker></defs><rect width="1600" height="900" fill="#ffffff"/><text x="40" y="52" font-size="30" font-weight="700" fill="#1f2937">4  Options compared</text><text x="40" y="82" font-size="16" fill="#5b6472">Four ways to carry the nextGen UI. Cells are facts from the repo or measurements where possible; the last row is an opinion for discussion.</text><rect x="260" y="108" width="322" height="62" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="272" y="135" font-size="17" font-weight="700" fill="#1f2937" text-anchor="start">A  Current</text><text x="272" y="156" font-size="13" font-weight="400" fill="#5b6472" text-anchor="start">refactor in place</text><rect x="590" y="108" width="322" height="62" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="602" y="135" font-size="17" font-weight="700" fill="#1f2937" text-anchor="start">B  A + push relay</text><text x="602" y="156" font-size="13" font-weight="400" fill="#5b6472" text-anchor="start">optional add-on</text><rect x="920" y="108" width="322" height="62" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="2"/><text x="932" y="135" font-size="17" font-weight="700" fill="#1f2937" text-anchor="start">C  Full Go backend</text><text x="932" y="156" font-size="13" font-weight="400" fill="#5b6472" text-anchor="start">MUI-style, own protocol</text><rect x="1250" y="108" width="322" height="62" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/><text x="1262" y="135" font-size="17" font-weight="700" fill="#1f2937" text-anchor="start">D  Adopt / fork MUI</text><text x="1262" y="156" font-size="13" font-weight="400" fill="#5b6472" text-anchor="start">its front end and server</text><rect x="40" y="180" width="212" height="64" rx="8" fill="#f8fafc" stroke="#c9d1dc" stroke-width="1.5"/><text x="52" y="210" font-size="15" font-weight="700" fill="#1f2937" text-anchor="start">Live updates</text><rect x="260" y="180" width="322" height="64" rx="8" fill="#ffffff" stroke="#c9d1dc" stroke-width="1.5"/><text x="272" y="204.0" font-size="13.5" font-weight="400" fill="#1f2937" text-anchor="start">10 s polling; long-poll route exists,</text><text x="272" y="221.55" font-size="13.5" font-weight="400" fill="#1f2937" text-anchor="start">unused</text><rect x="590" y="180" width="322" height="64" rx="8" fill="#ffffff" stroke="#c9d1dc" stroke-width="1.5"/><text x="602" y="204.0" font-size="13.5" font-weight="400" fill="#1f2937" text-anchor="start">push for events, polling as fallback</text><rect x="920" y="180" width="322" height="64" rx="8" fill="#ffffff" stroke="#c9d1dc" stroke-width="1.5"/><text x="932" y="204.0" font-size="13.5" font-weight="400" fill="#1f2937" text-anchor="start">push, built in</text><rect x="1250" y="180" width="322" height="64" rx="8" fill="#ffffff" stroke="#c9d1dc" stroke-width="1.5"/><text x="1262" y="204.0" font-size="13.5" font-weight="400" fill="#1f2937" text-anchor="start">push, built in</text><rect x="40" y="252" width="212" height="64" rx="8" fill="#f8fafc" stroke="#c9d1dc" stroke-width="1.5"/><text x="52" y="282" font-size="15" font-weight="700" fill="#1f2937" text-anchor="start">Cost per request (Pi 4)</text><rect x="260" y="252" width="322" height="64" rx="8" fill="#ffffff" stroke="#c9d1dc" stroke-width="1.5"/><text x="272" y="276.0" font-size="13.5" font-weight="400" fill="#1f2937" text-anchor="start">80 ms floor (process per request) + ReGa</text><rect x="590" y="252" width="322" height="64" rx="8" fill="#ffffff" stroke="#c9d1dc" stroke-width="1.5"/><text x="602" y="276.0" font-size="13.5" font-weight="400" fill="#1f2937" text-anchor="start">same for commands; one socket for updates</text><rect x="920" y="252" width="322" height="64" rx="8" fill="#ffffff" stroke="#c9d1dc" stroke-width="1.5"/><text x="932" y="276.0" font-size="13.5" font-weight="400" fill="#1f2937" text-anchor="start">no process start; daemon 20 MB, 0.8 % CPU</text><text x="932" y="293.55" font-size="13.5" font-weight="400" fill="#1f2937" text-anchor="start">(MUI measured)</text><rect x="1250" y="252" width="322" height="64" rx="8" fill="#ffffff" stroke="#c9d1dc" stroke-width="1.5"/><text x="1262" y="276.0" font-size="13.5" font-weight="400" fill="#1f2937" text-anchor="start">same as C</text><rect x="40" y="324" width="212" height="64" rx="8" fill="#f8fafc" stroke="#c9d1dc" stroke-width="1.5"/><text x="52" y="354" font-size="15" font-weight="700" fill="#1f2937" text-anchor="start">v1 contract, 180 methods</text><rect x="260" y="324" width="322" height="64" rx="8" fill="#ffffff" stroke="#c9d1dc" stroke-width="1.5"/><text x="272" y="348.0" font-size="13.5" font-weight="400" fill="#1f2937" text-anchor="start">kept, hardened, 133 call sites</text><rect x="590" y="324" width="322" height="64" rx="8" fill="#ffffff" stroke="#c9d1dc" stroke-width="1.5"/><text x="602" y="348.0" font-size="13.5" font-weight="400" fill="#1f2937" text-anchor="start">kept</text><rect x="920" y="324" width="322" height="64" rx="8" fill="#ffffff" stroke="#c9d1dc" stroke-width="1.5"/><text x="932" y="348.0" font-size="13.5" font-weight="400" fill="#1f2937" text-anchor="start">re-implemented (71 ReGa + 51 XML-RPC</text><text x="932" y="365.55" font-size="13.5" font-weight="400" fill="#1f2937" text-anchor="start">methods) or dropped</text><rect x="1250" y="324" width="322" height="64" rx="8" fill="#ffffff" stroke="#c9d1dc" stroke-width="1.5"/><text x="1262" y="348.0" font-size="13.5" font-weight="400" fill="#1f2937" text-anchor="start">not applicable: own protocol</text><rect x="40" y="396" width="212" height="64" rx="8" fill="#f8fafc" stroke="#c9d1dc" stroke-width="1.5"/><text x="52" y="426" font-size="15" font-weight="700" fill="#1f2937" text-anchor="start">Security model</text><rect x="260" y="396" width="322" height="64" rx="8" fill="#ffffff" stroke="#c9d1dc" stroke-width="1.5"/><text x="272" y="420.0" font-size="13.5" font-weight="400" fill="#1f2937" text-anchor="start">CCU session + levels; fixed scripts,</text><text x="272" y="437.55" font-size="13.5" font-weight="400" fill="#1f2937" text-anchor="start">tested</text><rect x="590" y="396" width="322" height="64" rx="8" fill="#ffffff" stroke="#c9d1dc" stroke-width="1.5"/><text x="602" y="420.0" font-size="13.5" font-weight="400" fill="#1f2937" text-anchor="start">adds ticket auth; relay read-only</text><rect x="920" y="396" width="322" height="64" rx="8" fill="#ffffff" stroke="#c9d1dc" stroke-width="1.5"/><text x="932" y="420.0" font-size="13.5" font-weight="400" fill="#1f2937" text-anchor="start">new auth and audit surface to build and</text><text x="932" y="437.55" font-size="13.5" font-weight="400" fill="#1f2937" text-anchor="start">test</text><rect x="1250" y="396" width="322" height="64" rx="8" fill="#ffffff" stroke="#c9d1dc" stroke-width="1.5"/><text x="1262" y="420.0" font-size="13.5" font-weight="400" fill="#1f2937" text-anchor="start">own sessions, optional AUTH_MODE=none;</text><text x="1262" y="437.55" font-size="13.5" font-weight="400" fill="#1f2937" text-anchor="start">scripts built by formatting (not audited)</text><rect x="40" y="468" width="212" height="64" rx="8" fill="#f8fafc" stroke="#c9d1dc" stroke-width="1.5"/><text x="52" y="498" font-size="15" font-weight="700" fill="#1f2937" text-anchor="start">Install / update</text><rect x="260" y="468" width="322" height="64" rx="8" fill="#ffffff" stroke="#c9d1dc" stroke-width="1.5"/><text x="272" y="492.0" font-size="13.5" font-weight="400" fill="#1f2937" text-anchor="start">installer, needs / remounted rw</text><rect x="590" y="468" width="322" height="64" rx="8" fill="#ffffff" stroke="#c9d1dc" stroke-width="1.5"/><text x="602" y="492.0" font-size="13.5" font-weight="400" fill="#1f2937" text-anchor="start">plus one add-on</text><rect x="920" y="468" width="322" height="64" rx="8" fill="#ffffff" stroke="#c9d1dc" stroke-width="1.5"/><text x="932" y="492.0" font-size="13.5" font-weight="400" fill="#1f2937" text-anchor="start">add-on, cross-compile per architecture</text><rect x="1250" y="468" width="322" height="64" rx="8" fill="#ffffff" stroke="#c9d1dc" stroke-width="1.5"/><text x="1262" y="492.0" font-size="13.5" font-weight="400" fill="#1f2937" text-anchor="start">add-on, release binary</text><rect x="40" y="540" width="212" height="64" rx="8" fill="#f8fafc" stroke="#c9d1dc" stroke-width="1.5"/><text x="52" y="570" font-size="15" font-weight="700" fill="#1f2937" text-anchor="start">Tests</text><rect x="260" y="540" width="322" height="64" rx="8" fill="#ffffff" stroke="#c9d1dc" stroke-width="1.5"/><text x="272" y="564.0" font-size="13.5" font-weight="400" fill="#1f2937" text-anchor="start">1,390 Tcl contract tests (10 components),</text><text x="272" y="581.55" font-size="13.5" font-weight="400" fill="#1f2937" text-anchor="start">19 browser suites</text><rect x="590" y="540" width="322" height="64" rx="8" fill="#ffffff" stroke="#c9d1dc" stroke-width="1.5"/><text x="602" y="564.0" font-size="13.5" font-weight="400" fill="#1f2937" text-anchor="start">plus relay tests (to write)</text><rect x="920" y="540" width="322" height="64" rx="8" fill="#ffffff" stroke="#c9d1dc" stroke-width="1.5"/><text x="932" y="564.0" font-size="13.5" font-weight="400" fill="#1f2937" text-anchor="start">whole new suite (to write)</text><rect x="1250" y="540" width="322" height="64" rx="8" fill="#ffffff" stroke="#c9d1dc" stroke-width="1.5"/><text x="1262" y="564.0" font-size="13.5" font-weight="400" fill="#1f2937" text-anchor="start">upstream's</text><rect x="40" y="612" width="212" height="64" rx="8" fill="#f8fafc" stroke="#c9d1dc" stroke-width="1.5"/><text x="52" y="642" font-size="15" font-weight="700" fill="#1f2937" text-anchor="start">Licence</text><rect x="260" y="612" width="322" height="64" rx="8" fill="#ffffff" stroke="#c9d1dc" stroke-width="1.5"/><text x="272" y="636.0" font-size="13.5" font-weight="400" fill="#1f2937" text-anchor="start">Apache-2.0 (+ HMSL for eQ-3 parts)</text><rect x="590" y="612" width="322" height="64" rx="8" fill="#ffffff" stroke="#c9d1dc" stroke-width="1.5"/><text x="602" y="636.0" font-size="13.5" font-weight="400" fill="#1f2937" text-anchor="start">Apache-2.0</text><rect x="920" y="612" width="322" height="64" rx="8" fill="#ffffff" stroke="#c9d1dc" stroke-width="1.5"/><text x="932" y="636.0" font-size="13.5" font-weight="400" fill="#1f2937" text-anchor="start">your choice</text><rect x="1250" y="612" width="322" height="64" rx="8" fill="#ffffff" stroke="#c9d1dc" stroke-width="1.5"/><text x="1262" y="636.0" font-size="13.5" font-weight="400" fill="#1f2937" text-anchor="start">AGPL-3.0: derived work is AGPL</text><rect x="40" y="684" width="212" height="64" rx="8" fill="#f8fafc" stroke="#c9d1dc" stroke-width="1.5"/><text x="52" y="714" font-size="15" font-weight="700" fill="#1f2937" text-anchor="start">Effort / rollback</text><rect x="260" y="684" width="322" height="64" rx="8" fill="#ffffff" stroke="#c9d1dc" stroke-width="1.5"/><text x="272" y="708.0" font-size="13.5" font-weight="400" fill="#1f2937" text-anchor="start">done, ongoing; restore a backup</text><rect x="590" y="684" width="322" height="64" rx="8" fill="#ffffff" stroke="#c9d1dc" stroke-width="1.5"/><text x="602" y="708.0" font-size="13.5" font-weight="400" fill="#1f2937" text-anchor="start">small to medium; remove the add-on</text><rect x="920" y="684" width="322" height="64" rx="8" fill="#ffffff" stroke="#c9d1dc" stroke-width="1.5"/><text x="932" y="708.0" font-size="13.5" font-weight="400" fill="#1f2937" text-anchor="start">large rewrite risk; hard to undo</text><rect x="1250" y="684" width="322" height="64" rx="8" fill="#ffffff" stroke="#c9d1dc" stroke-width="1.5"/><text x="1262" y="708.0" font-size="13.5" font-weight="400" fill="#1f2937" text-anchor="start">low to adopt; dependency, little control</text><rect x="40" y="756" width="212" height="62" rx="8" fill="#fef9c3" stroke="#ca8a04" stroke-width="2"/><text x="52" y="784" font-size="15" font-weight="700" fill="#1f2937" text-anchor="start">Read (opinion)</text><rect x="260" y="756" width="322" height="62" rx="8" fill="#fef9c3" stroke="#ca8a04" stroke-width="2"/><text x="272" y="781.0" font-size="13.5" font-weight="400" fill="#1f2937" text-anchor="start">baseline; right while push is not needed</text><rect x="590" y="756" width="322" height="62" rx="8" fill="#fef9c3" stroke="#ca8a04" stroke-width="2"/><text x="602" y="781.0" font-size="13.5" font-weight="400" fill="#1f2937" text-anchor="start">best next step IF live updates matter</text><rect x="920" y="756" width="322" height="62" rx="8" fill="#fef9c3" stroke="#ca8a04" stroke-width="2"/><text x="932" y="781.0" font-size="13.5" font-weight="400" fill="#1f2937" text-anchor="start">only if the v1 contract and the classic</text><text x="932" y="798.55" font-size="13.5" font-weight="400" fill="#1f2937" text-anchor="start">UI are given up</text><rect x="1250" y="756" width="322" height="62" rx="8" fill="#fef9c3" stroke="#ca8a04" stroke-width="2"/><text x="1262" y="781.0" font-size="13.5" font-weight="400" fill="#1f2937" text-anchor="start">not combinable with an Apache tree; a</text><text x="1262" y="798.55" font-size="13.5" font-weight="400" fill="#1f2937" text-anchor="start">different product</text><text x="40" y="869" font-size="12.5" font-weight="400" fill="#5b6472" text-anchor="start">Sources: modernizer ADR (rejected: full rewrite, gateway now, microservices); MUI measured on the test CCU; licences from LICENSE files. Not legal advice. Pi 4 numbers are not CCU3 hardware: repeat on</text><text x="40" y="886" font-size="12.5" font-weight="400" fill="#5b6472" text-anchor="start">the target boards before deciding.</text></svg>
