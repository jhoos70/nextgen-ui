<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family='Inter, "Segoe UI", Helvetica, Arial, sans-serif'><defs><marker id="a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker></defs><rect width="1600" height="900" fill="#ffffff"/><text x="40" y="52" font-size="30" font-weight="700" fill="#1f2937">5  The modernizer's drivers, re-checked</text><text x="40" y="82" font-size="16" fill="#5b6472">The October decision (refactor in place, gateway only after a measurement gate) rested on six drivers. What do we know now?</text><rect x="40" y="112" width="330" height="40" rx="8" fill="#0f172a"/><text x="52" y="138" font-size="15" font-weight="700" fill="#ffffff" text-anchor="start">Driver (October)</text><rect x="378" y="112" width="140" height="40" rx="8" fill="#0f172a"/><text x="390" y="138" font-size="15" font-weight="700" fill="#ffffff" text-anchor="start">Status</text><rect x="526" y="112" width="800" height="40" rx="8" fill="#0f172a"/><text x="538" y="138" font-size="15" font-weight="700" fill="#ffffff" text-anchor="start">Evidence</text><rect x="1334" y="112" width="200" height="40" rx="8" fill="#0f172a"/><text x="1346" y="138" font-size="15" font-weight="700" fill="#ffffff" text-anchor="start">Effect</text><rect x="40" y="160" width="330" height="106" rx="8" fill="#ffffff" stroke="#c9d1dc" stroke-width="1.5"/><rect x="378" y="160" width="140" height="106" rx="8" fill="#dcfce7" stroke="#c9d1dc" stroke-width="1.5"/><rect x="526" y="160" width="800" height="106" rx="8" fill="#ffffff" stroke="#c9d1dc" stroke-width="1.5"/><rect x="1334" y="160" width="200" height="106" rx="8" fill="#ffffff" stroke="#c9d1dc" stroke-width="1.5"/><text x="52" y="186.0" font-size="15" font-weight="700" fill="#1f2937" text-anchor="start">Frozen v1 contract; 133 call sites</text><text x="390" y="188" font-size="14" font-weight="700" fill="#1f2937" text-anchor="start">still true</text><text x="538" y="184.0" font-size="14.5" font-weight="400" fill="#1f2937" text-anchor="start">The nextGen UI uses the ADDITIVE v2 routes. A new backend would only have to replace v1 if the</text><text x="538" y="203.14" font-size="14.5" font-weight="400" fill="#1f2937" text-anchor="start">classic UI is replaced too (it is not: long-term coexistence).</text><text x="1346" y="186.0" font-size="14" font-weight="600" fill="#1f2937" text-anchor="start">unchanged</text><rect x="40" y="274" width="330" height="106" rx="8" fill="#ffffff" stroke="#c9d1dc" stroke-width="1.5"/><rect x="378" y="274" width="140" height="106" rx="8" fill="#dbeafe" stroke="#c9d1dc" stroke-width="1.5"/><rect x="526" y="274" width="800" height="106" rx="8" fill="#ffffff" stroke="#c9d1dc" stroke-width="1.5"/><rect x="1334" y="274" width="200" height="106" rx="8" fill="#ffffff" stroke="#c9d1dc" stroke-width="1.5"/><text x="52" y="300.0" font-size="15" font-weight="700" fill="#1f2937" text-anchor="start">Small device, tclsh per request</text><text x="390" y="302" font-size="14" font-weight="700" fill="#1f2937" text-anchor="start">measured</text><text x="538" y="298.0" font-size="14.5" font-weight="400" fill="#1f2937" text-anchor="start">Test CCU: Pi 4, 4 cores, 3.8 GB RAM, load 0.16. A persistent Go process (MUI) costs 20 MB and 0.8 %</text><text x="538" y="317.14" font-size="14.5" font-weight="400" fill="#1f2937" text-anchor="start">of one core. The process-per-request floor is 80 ms vs 5 ms static. Other boards (older CCU3</text><text x="538" y="336.28" font-size="14.5" font-weight="400" fill="#1f2937" text-anchor="start">hardware, small VMs) are NOT measured.</text><text x="1346" y="300.0" font-size="14" font-weight="600" fill="#1f2937" text-anchor="start">weakens 'too heavy'</text><rect x="40" y="388" width="330" height="106" rx="8" fill="#ffffff" stroke="#c9d1dc" stroke-width="1.5"/><rect x="378" y="388" width="140" height="106" rx="8" fill="#fef3c7" stroke="#c9d1dc" stroke-width="1.5"/><rect x="526" y="388" width="800" height="106" rx="8" fill="#ffffff" stroke="#c9d1dc" stroke-width="1.5"/><rect x="1334" y="388" width="200" height="106" rx="8" fill="#ffffff" stroke="#c9d1dc" stroke-width="1.5"/><text x="52" y="414.0" font-size="15" font-weight="700" fill="#1f2937" text-anchor="start">No tests, high regression risk</text><text x="390" y="416" font-size="14" font-weight="700" fill="#1f2937" text-anchor="start">changed</text><text x="538" y="412.0" font-size="14.5" font-weight="400" fill="#1f2937" text-anchor="start">1,390 Tcl contract tests in 10 components (the programs route alone has 60), 19 browser suites and</text><text x="538" y="431.14" font-size="14.5" font-weight="400" fill="#1f2937" text-anchor="start">golden fixtures for v1 now exist; 16 older tests fail and are known. A rewrite would throw this</text><text x="538" y="450.28" font-size="14.5" font-weight="400" fill="#1f2937" text-anchor="start">away; a relay can add to it.</text><text x="1346" y="414.0" font-size="14" font-weight="600" fill="#1f2937" text-anchor="start">favours keeping the</text><text x="1346" y="432.2" font-size="14" font-weight="600" fill="#1f2937" text-anchor="start">code</text><rect x="40" y="502" width="330" height="106" rx="8" fill="#ffffff" stroke="#c9d1dc" stroke-width="1.5"/><rect x="378" y="502" width="140" height="106" rx="8" fill="#fef3c7" stroke="#c9d1dc" stroke-width="1.5"/><rect x="526" y="502" width="800" height="106" rx="8" fill="#ffffff" stroke="#c9d1dc" stroke-width="1.5"/><rect x="1334" y="502" width="200" height="106" rx="8" fill="#ffffff" stroke="#c9d1dc" stroke-width="1.5"/><text x="52" y="528.0" font-size="15" font-weight="700" fill="#1f2937" text-anchor="start">Closed ReGa / XML-RPC only as Tcl</text><text x="52" y="547.5" font-size="15" font-weight="700" fill="#1f2937" text-anchor="start">extensions</text><text x="390" y="530" font-size="14" font-weight="700" fill="#1f2937" text-anchor="start">partly outdated</text><text x="538" y="526.0" font-size="14.5" font-weight="400" fill="#1f2937" text-anchor="start">MUI shows that a Go program can speak XML-RPC and run ReGa scripts itself. It also rebuilt</text><text x="538" y="545.14" font-size="14.5" font-weight="400" fill="#1f2937" text-anchor="start">authentication and the privilege model. Possible, not free.</text><text x="1346" y="528.0" font-size="14" font-weight="600" fill="#1f2937" text-anchor="start">no longer a blocker</text><rect x="40" y="616" width="330" height="106" rx="8" fill="#ffffff" stroke="#c9d1dc" stroke-width="1.5"/><rect x="378" y="616" width="140" height="106" rx="8" fill="#dcfce7" stroke="#c9d1dc" stroke-width="1.5"/><rect x="526" y="616" width="800" height="106" rx="8" fill="#ffffff" stroke="#c9d1dc" stroke-width="1.5"/><rect x="1334" y="616" width="200" height="106" rx="8" fill="#ffffff" stroke="#c9d1dc" stroke-width="1.5"/><text x="52" y="642.0" font-size="15" font-weight="700" fill="#1f2937" text-anchor="start">Classic and nextGen must coexist</text><text x="390" y="644" font-size="14" font-weight="700" fill="#1f2937" text-anchor="start">still true</text><text x="538" y="640.0" font-size="14.5" font-weight="400" fill="#1f2937" text-anchor="start">A full Go backend would be a THIRD stack beside Tcl (classic) and the CGI routes. An optional relay</text><text x="538" y="659.14" font-size="14.5" font-weight="400" fill="#1f2937" text-anchor="start">is a small second process.</text><text x="1346" y="642.0" font-size="14" font-weight="600" fill="#1f2937" text-anchor="start">favours B over C</text><rect x="40" y="730" width="330" height="106" rx="8" fill="#ffffff" stroke="#c9d1dc" stroke-width="1.5"/><rect x="378" y="730" width="140" height="106" rx="8" fill="#fee2e2" stroke="#c9d1dc" stroke-width="1.5"/><rect x="526" y="730" width="800" height="106" rx="8" fill="#ffffff" stroke="#c9d1dc" stroke-width="1.5"/><rect x="1334" y="730" width="200" height="106" rx="8" fill="#ffffff" stroke="#c9d1dc" stroke-width="1.5"/><text x="52" y="756.0" font-size="15" font-weight="700" fill="#1f2937" text-anchor="start">Gateway only after a measurement</text><text x="52" y="775.5" font-size="15" font-weight="700" fill="#1f2937" text-anchor="start">gate</text><text x="390" y="758" font-size="14" font-weight="700" fill="#1f2937" text-anchor="start">gate reached</text><text x="538" y="754.0" font-size="14.5" font-weight="400" fill="#1f2937" text-anchor="start">What a CGI cannot offer at all is push; per-request cost is moderate (80 ms floor, not measured</text><text x="538" y="773.14" font-size="14.5" font-weight="400" fill="#1f2937" text-anchor="start">under load). Polling many lists is where it adds up, which I have NOT measured. That points at the</text><text x="538" y="792.28" font-size="14.5" font-weight="400" fill="#1f2937" text-anchor="start">narrow gateway of slide 3 rather than a rewrite, but the load test is still open.</text><text x="1346" y="756.0" font-size="14" font-weight="600" fill="#1f2937" text-anchor="start">decision: B or stay on</text><text x="1346" y="774.2" font-size="14" font-weight="600" fill="#1f2937" text-anchor="start">A</text><text x="40" y="886" font-size="12.5" font-weight="400" fill="#5b6472" text-anchor="start">Sources: .migration/webui-api/architect/target-architecture.adr.md and plan/webui-api.plan.md ('Rejected Options', 'Decision gate for gateway'); measurements of 2026-11-08 on the test CCU.</text></svg>
