<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family='Inter, "Segoe UI", Helvetica, Arial, sans-serif'><defs><marker id="a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker></defs><rect width="1600" height="900" fill="#ffffff"/><text x="40" y="52" font-size="30" font-weight="700" fill="#1f2937">9  Decisions made while building, and their outcome (2 of 2)</text><text x="40" y="82" font-size="16" fill="#5b6472">Engineering choices of the build phase (2026-11-01 to 11-08). Status as of 2026-11-08.</text><rect x="40" y="104" width="300" height="36" rx="8" fill="#0f172a"/><text x="52" y="128" font-size="14.5" font-weight="700" fill="#ffffff" text-anchor="start">Decision</text><rect x="348" y="104" width="300" height="36" rx="8" fill="#0f172a"/><text x="360" y="128" font-size="14.5" font-weight="700" fill="#ffffff" text-anchor="start">Why</text><rect x="656" y="104" width="640" height="36" rx="8" fill="#0f172a"/><text x="668" y="128" font-size="14.5" font-weight="700" fill="#ffffff" text-anchor="start">Outcome (what we know)</text><rect x="1304" y="104" width="210" height="36" rx="8" fill="#0f172a"/><text x="1316" y="128" font-size="14.5" font-weight="700" fill="#ffffff" text-anchor="start">Verdict</text><rect x="40" y="148" width="300" height="92" rx="8" fill="#f8fafc" stroke="#c9d1dc" stroke-width="1.5"/><text x="52" y="172.0" font-size="13.5" font-weight="700" fill="#1f2937" text-anchor="start">Verify on a real ReGa (restored copy)</text><text x="52" y="189.55" font-size="13.5" font-weight="700" fill="#1f2937" text-anchor="start">before the CCU3</text><rect x="348" y="148" width="300" height="92" rx="8" fill="#ffffff" stroke="#c9d1dc" stroke-width="1.5"/><text x="360" y="172.0" font-size="13.5" font-weight="400" fill="#1f2937" text-anchor="start">mocks hide how ReGa behaves</text><rect x="656" y="148" width="640" height="92" rx="8" fill="#ffffff" stroke="#c9d1dc" stroke-width="1.5"/><text x="668" y="172.0" font-size="13.5" font-weight="400" fill="#1f2937" text-anchor="start">Six traps that mocks missed: &amp;&amp; does not short-circuit, '!' binds loosely, an</text><text x="668" y="189.55" font-size="13.5" font-weight="400" fill="#1f2937" text-anchor="start">undefined variable silently kills a script, numbers assigned to strings, '!= null' is</text><text x="668" y="207.1" font-size="13.5" font-weight="400" fill="#1f2937" text-anchor="start">unreliable, a deleted time condition empties its timer. The editors ran on the</text><text x="668" y="224.65" font-size="13.5" font-weight="400" fill="#1f2937" text-anchor="start">restored copy only; none has run on the CCU3 yet.</text><rect x="1304" y="148" width="210" height="92" rx="8" fill="#dcfce7" stroke="#c9d1dc" stroke-width="1.5"/><text x="1316" y="172.0" font-size="13.5" font-weight="700" fill="#1f2937" text-anchor="start">Held</text><rect x="40" y="246" width="300" height="57" rx="8" fill="#f8fafc" stroke="#c9d1dc" stroke-width="1.5"/><text x="52" y="270.0" font-size="13.5" font-weight="700" fill="#1f2937" text-anchor="start">Fixed server scripts, values bound as</text><text x="52" y="287.55" font-size="13.5" font-weight="700" fill="#1f2937" text-anchor="start">variables</text><rect x="348" y="246" width="300" height="57" rx="8" fill="#ffffff" stroke="#c9d1dc" stroke-width="1.5"/><text x="360" y="270.0" font-size="13.5" font-weight="400" fill="#1f2937" text-anchor="start">no ReGa code built from user input</text><rect x="656" y="246" width="640" height="57" rx="8" fill="#ffffff" stroke="#c9d1dc" stroke-width="1.5"/><text x="668" y="270.0" font-size="13.5" font-weight="400" fill="#1f2937" text-anchor="start">Every route runs fixed text and the tests assert it. Price: each feature needs its own</text><text x="668" y="287.55" font-size="13.5" font-weight="400" fill="#1f2937" text-anchor="start">Tcl route and tests, and the scripts cannot be shared with other tools.</text><rect x="1304" y="246" width="210" height="57" rx="8" fill="#dcfce7" stroke="#c9d1dc" stroke-width="1.5"/><text x="1316" y="270.0" font-size="13.5" font-weight="700" fill="#1f2937" text-anchor="start">Held</text><rect x="40" y="309" width="300" height="74" rx="8" fill="#f8fafc" stroke="#c9d1dc" stroke-width="1.5"/><text x="52" y="333.0" font-size="13.5" font-weight="700" fill="#1f2937" text-anchor="start">Structure changes on a working copy,</text><text x="52" y="350.55" font-size="13.5" font-weight="700" fill="#1f2937" text-anchor="start">put back in one step</text><rect x="348" y="309" width="300" height="74" rx="8" fill="#ffffff" stroke="#c9d1dc" stroke-width="1.5"/><text x="360" y="333.0" font-size="13.5" font-weight="400" fill="#1f2937" text-anchor="start">the classic editor's own pattern; a</text><text x="360" y="350.55" font-size="13.5" font-weight="400" fill="#1f2937" text-anchor="start">failure must not damage a program</text><rect x="656" y="309" width="640" height="74" rx="8" fill="#ffffff" stroke="#c9d1dc" stroke-width="1.5"/><text x="668" y="333.0" font-size="13.5" font-weight="400" fill="#1f2937" text-anchor="start">Used for actions, conditions and the else part. Every refusal and failure test left</text><text x="668" y="350.55" font-size="13.5" font-weight="400" fill="#1f2937" text-anchor="start">the program unchanged, with no stray copy. An active program is re-activated and can</text><text x="668" y="368.1" font-size="13.5" font-weight="400" fill="#1f2937" text-anchor="start">run at once: the editor warns first.</text><rect x="1304" y="309" width="210" height="74" rx="8" fill="#dcfce7" stroke="#c9d1dc" stroke-width="1.5"/><text x="1316" y="333.0" font-size="13.5" font-weight="700" fill="#1f2937" text-anchor="start">Held</text><rect x="40" y="389" width="300" height="74" rx="8" fill="#f8fafc" stroke="#c9d1dc" stroke-width="1.5"/><text x="52" y="413.0" font-size="13.5" font-weight="700" fill="#1f2937" text-anchor="start">Program editor in stages: manage,</text><text x="52" y="430.55" font-size="13.5" font-weight="700" fill="#1f2937" text-anchor="start">read, actions, conditions, else</text><rect x="348" y="389" width="300" height="74" rx="8" fill="#ffffff" stroke="#c9d1dc" stroke-width="1.5"/><text x="360" y="413.0" font-size="13.5" font-weight="400" fill="#1f2937" text-anchor="start">the classic editor is about 2,500</text><text x="360" y="430.55" font-size="13.5" font-weight="400" fill="#1f2937" text-anchor="start">lines over raw integer codes</text><rect x="656" y="389" width="640" height="74" rx="8" fill="#ffffff" stroke="#c9d1dc" stroke-width="1.5"/><text x="668" y="413.0" font-size="13.5" font-weight="400" fill="#1f2937" text-anchor="start">All five stages built in about a week. Reading 54 real programs showed 74 of 79</text><text x="668" y="430.55" font-size="13.5" font-weight="400" fill="#1f2937" text-anchor="start">actions are scripts, so scripts became a first-class action. Time controls can be kept</text><text x="668" y="448.1" font-size="13.5" font-weight="400" fill="#1f2937" text-anchor="start">or removed, not created; else-if and weekly programs are open.</text><rect x="1304" y="389" width="210" height="74" rx="8" fill="#fef3c7" stroke="#c9d1dc" stroke-width="1.5"/><text x="1316" y="413.0" font-size="13.5" font-weight="700" fill="#1f2937" text-anchor="start">Held; three parts open</text><rect x="40" y="469" width="300" height="74" rx="8" fill="#f8fafc" stroke="#c9d1dc" stroke-width="1.5"/><text x="52" y="493.0" font-size="13.5" font-weight="700" fill="#1f2937" text-anchor="start">Deploy by installer with backups, not</text><text x="52" y="510.55" font-size="13.5" font-weight="700" fill="#1f2937" text-anchor="start">as an add-on</text><rect x="348" y="469" width="300" height="74" rx="8" fill="#ffffff" stroke="#c9d1dc" stroke-width="1.5"/><text x="360" y="493.0" font-size="13.5" font-weight="400" fill="#1f2937" text-anchor="start">files live in /www (needs a remount);</text><text x="360" y="510.55" font-size="13.5" font-weight="400" fill="#1f2937" text-anchor="start">per-file rules for patched files</text><rect x="656" y="469" width="640" height="74" rx="8" fill="#ffffff" stroke="#c9d1dc" stroke-width="1.5"/><text x="668" y="493.0" font-size="13.5" font-weight="400" fill="#1f2937" text-anchor="start">17 backups on the CCU3; restore works. One regression: methods.conf shipped as a whole</text><text x="668" y="510.55" font-size="13.5" font-weight="400" fill="#1f2937" text-anchor="start">file left 4 methods 'not found' on the CCU3 until the upstream merge. Add-on packaging</text><text x="668" y="528.1" font-size="13.5" font-weight="400" fill="#1f2937" text-anchor="start">exists (3 betas) but is not what runs.</text><rect x="1304" y="469" width="210" height="74" rx="8" fill="#fee2e2" stroke="#c9d1dc" stroke-width="1.5"/><text x="1316" y="493.0" font-size="13.5" font-weight="700" fill="#1f2937" text-anchor="start">Revisit: entry-level</text><text x="1316" y="510.55" font-size="13.5" font-weight="700" fill="#1f2937" text-anchor="start">patch</text><rect x="40" y="549" width="300" height="74" rx="8" fill="#f8fafc" stroke="#c9d1dc" stroke-width="1.5"/><text x="52" y="573.0" font-size="13.5" font-weight="700" fill="#1f2937" text-anchor="start">Tests pin behaviour; two pins for</text><text x="52" y="590.55" font-size="13.5" font-weight="700" fill="#1f2937" text-anchor="start">'ours'</text><rect x="348" y="549" width="300" height="74" rx="8" fill="#ffffff" stroke="#c9d1dc" stroke-width="1.5"/><text x="360" y="573.0" font-size="13.5" font-weight="400" fill="#1f2937" text-anchor="start">make regressions visible, measure the</text><text x="360" y="590.55" font-size="13.5" font-weight="400" fill="#1f2937" text-anchor="start">delta against upstream</text><rect x="656" y="549" width="640" height="74" rx="8" fill="#ffffff" stroke="#c9d1dc" stroke-width="1.5"/><text x="668" y="573.0" font-size="13.5" font-weight="400" fill="#1f2937" text-anchor="start">1,390 Tcl tests, 19 browser suites and 219 unit tests made the upstream changes</text><text x="668" y="590.55" font-size="13.5" font-weight="400" fill="#1f2937" text-anchor="start">visible at the merge. Price: about 30 follow-up edits and a pin to advance on every</text><text x="668" y="608.1" font-size="13.5" font-weight="400" fill="#1f2937" text-anchor="start">merge (slide 7).</text><rect x="1304" y="549" width="210" height="74" rx="8" fill="#fef3c7" stroke="#c9d1dc" stroke-width="1.5"/><text x="1316" y="573.0" font-size="13.5" font-weight="700" fill="#1f2937" text-anchor="start">Held; derive counts from</text><text x="1316" y="590.55" font-size="13.5" font-weight="700" fill="#1f2937" text-anchor="start">the registry</text><rect x="40" y="633" width="1520" height="120" rx="10" fill="#fef9c3" stroke="#ca8a04" stroke-width="2"/><text x="54" y="660.5" font-size="15.5" font-weight="700" fill="#1f2937" text-anchor="start">Still open after the migration phase</text><text x="54" y="684.7" font-size="13.5" font-weight="400" fill="#1f2937" text-anchor="start">• a live push channel (slides 3 and 6)   - UTF-8 stage 2 and clean URLs (route A)   - time controls, else-if and weekly programs   - upstreaming the v1 hardening</text><text x="54" y="702.9250000000001" font-size="13.5" font-weight="400" fill="#1f2937" text-anchor="start">• the methods.conf deployment (entry by entry)   - a weekly upstream merge   - a full dependency licence scan   - a real radio interface for the duty-cycle and device paths (the test CCUs have</text><text x="54" y="721.1500000000001" font-size="13.5" font-weight="400" fill="#1f2937" text-anchor="start">   none)</text><text x="40" y="886" font-size="12.5" font-weight="400" fill="#5b6472" text-anchor="start">Sources: .migration/plan/decisions-ui.md (items 1 to 18), the test runs of 2026-11-08, the install checks and backups on the test CCU. Verdicts are an opinion.</text></svg>
