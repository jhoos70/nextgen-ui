<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family='Inter, "Segoe UI", Helvetica, Arial, sans-serif'><defs><marker id="a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker></defs><rect width="1600" height="900" fill="#ffffff"/><text x="40" y="52" font-size="30" font-weight="700" fill="#1f2937">3  Candidate: keep the CGI, add an optional push relay</text><text x="40" y="82" font-size="16" fill="#5b6472">Commands and reads stay on the tested v2 routes; a small read-only process only PUSHES changes. If it is not installed, the UI polls as today.</text><rect x="40" y="120" width="300" height="190" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="54" y="149" font-size="17" font-weight="700" fill="#1f2937" text-anchor="start">nextGen UI</text><text x="54" y="175.0" font-size="15" font-weight="400" fill="#1f2937" text-anchor="start">• same SPA as today</text><text x="54" y="195.25" font-size="15" font-weight="400" fill="#1f2937" text-anchor="start">• new hook useLive(): tries push</text><text x="54" y="215.5" font-size="15" font-weight="400" fill="#1f2937" text-anchor="start">   first, falls back to polling</text><text x="54" y="235.75" font-size="15" font-weight="400" fill="#1f2937" text-anchor="start">   every 10 s</text><text x="54" y="256.0" font-size="15" font-weight="400" fill="#1f2937" text-anchor="start">• commands still go to the v2</text><text x="54" y="276.25" font-size="15" font-weight="400" fill="#1f2937" text-anchor="start">   routes</text><rect x="410" y="120" width="300" height="190" rx="10" fill="#e5e7eb" stroke="#6b7280" stroke-width="2"/><text x="424" y="149" font-size="17" font-weight="700" fill="#1f2937" text-anchor="start">lighttpd</text><text x="424" y="175.0" font-size="15" font-weight="400" fill="#1f2937" text-anchor="start">• /api/.../v2/*  CGI as today</text><text x="424" y="195.25" font-size="15" font-weight="400" fill="#1f2937" text-anchor="start">• /webui/next/live  proxied to</text><text x="424" y="215.5" font-size="15" font-weight="400" fill="#1f2937" text-anchor="start">   the relay (SSE or WebSocket)</text><text x="424" y="235.75" font-size="15" font-weight="400" fill="#1f2937" text-anchor="start">• rule in</text><text x="424" y="256.0" font-size="15" font-weight="400" fill="#1f2937" text-anchor="start">   /usr/local/etc/config/lighttpd</text><text x="424" y="276.25" font-size="15" font-weight="400" fill="#1f2937" text-anchor="start">   (no remount)</text><rect x="790" y="120" width="400" height="170" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/><text x="804" y="149" font-size="17" font-weight="700" fill="#1f2937" text-anchor="start">v2 CGI routes (unchanged)</text><text x="804" y="175.0" font-size="15" font-weight="400" fill="#1f2937" text-anchor="start">• session check, levels 0 / 1 / 2 / 8</text><text x="804" y="195.25" font-size="15" font-weight="400" fill="#1f2937" text-anchor="start">• NEW: live-ticket route: after the normal</text><text x="804" y="215.5" font-size="15" font-weight="400" fill="#1f2937" text-anchor="start">   session check it writes a one-time ticket</text><text x="804" y="235.75" font-size="15" font-weight="400" fill="#1f2937" text-anchor="start">   (file in /tmp) and returns it</text><text x="804" y="256.0" font-size="15" font-weight="400" fill="#1f2937" text-anchor="start">• all writes stay here, with their tests</text><rect x="1290" y="120" width="270" height="109" rx="10" fill="#f1f5f9" stroke="#475569" stroke-width="2"/><text x="1304" y="149" font-size="17" font-weight="700" fill="#1f2937" text-anchor="start">ReGaHss</text><text x="1304" y="175.0" font-size="15" font-weight="400" fill="#1f2937" text-anchor="start">closed source</text><text x="1304" y="195.25" font-size="15" font-weight="400" fill="#1f2937" text-anchor="start">unchanged</text><rect x="790" y="360" width="400" height="251" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2" stroke-dasharray="7 5"/><text x="804" y="389" font-size="17" font-weight="700" fill="#1f2937" text-anchor="start">Push relay (optional add-on, gated)</text><text x="804" y="415.0" font-size="15" font-weight="400" fill="#1f2937" text-anchor="start">• one process, listens on 127.0.0.1 only</text><text x="804" y="435.25" font-size="15" font-weight="400" fill="#1f2937" text-anchor="start">• accepts a connection only with a valid</text><text x="804" y="455.5" font-size="15" font-weight="400" fill="#1f2937" text-anchor="start">   one-time ticket; keeps the user's level</text><text x="804" y="475.75" font-size="15" font-weight="400" fill="#1f2937" text-anchor="start">• registers XML-RPC callbacks with the</text><text x="804" y="496.0" font-size="15" font-weight="400" fill="#1f2937" text-anchor="start">   interfaces: device events arrive</text><text x="804" y="516.25" font-size="15" font-weight="400" fill="#1f2937" text-anchor="start">• polls ReGa for system variables, alarms</text><text x="804" y="536.5" font-size="15" font-weight="400" fill="#1f2937" text-anchor="start">   and service messages, sends only</text><text x="804" y="556.75" font-size="15" font-weight="400" fill="#1f2937" text-anchor="start">   differences</text><text x="804" y="577.0" font-size="15" font-weight="400" fill="#1f2937" text-anchor="start">• READ-ONLY: no commands, no ReGa writes</text><rect x="1290" y="360" width="270" height="150" rx="10" fill="#f1f5f9" stroke="#475569" stroke-width="2"/><text x="1304" y="389" font-size="17" font-weight="700" fill="#1f2937" text-anchor="start">Interface processes</text><text x="1304" y="415.0" font-size="15" font-weight="400" fill="#1f2937" text-anchor="start">rfd, HmIPServer, hs485d</text><text x="1304" y="435.25" font-size="15" font-weight="400" fill="#1f2937" text-anchor="start">unchanged</text><text x="1304" y="455.5" font-size="15" font-weight="400" fill="#1f2937" text-anchor="start">call the relay back with</text><text x="1304" y="475.75" font-size="15" font-weight="400" fill="#1f2937" text-anchor="start">events</text><line x1="340" y1="180" x2="410" y2="180" stroke="#374151" stroke-width="2.4" marker-end="url(#a)" marker-start="url(#a)"/><text x="375" y="158.0" font-size="13" font-weight="600" fill="#374151" text-anchor="middle">HTTP</text><line x1="710" y1="180" x2="790" y2="180" stroke="#374151" stroke-width="2.4" marker-end="url(#a)"/><text x="750" y="158.0" font-size="13" font-weight="600" fill="#374151" text-anchor="middle">CGI</text><line x1="1190" y1="180" x2="1290" y2="180" stroke="#374151" stroke-width="2.4" marker-end="url(#a)"/><text x="1240" y="158.0" font-size="13" font-weight="600" fill="#374151" text-anchor="middle">tclrega.so</text><line x1="990" y1="290" x2="990" y2="360" stroke="#16a34a" stroke-width="2.4" stroke-dasharray="8 6" marker-end="url(#a)"/><text x="1002" y="326.0" font-size="13" font-weight="600" fill="#16a34a" text-anchor="start">one-time ticket</text><line x1="660" y1="310" x2="790" y2="420" stroke="#16a34a" stroke-width="2.4" stroke-dasharray="8 6" marker-end="url(#a)"/><text x="560" y="336.0" font-size="13" font-weight="600" fill="#16a34a" text-anchor="middle">SSE / WebSocket + ticket</text><line x1="1190" y1="480" x2="1290" y2="480" stroke="#16a34a" stroke-width="2.4" stroke-dasharray="8 6" marker-end="url(#a)"/><text x="1240" y="458.0" font-size="13" font-weight="600" fill="#16a34a" text-anchor="middle">events</text><line x1="1190" y1="390" x2="1330" y2="229" stroke="#16a34a" stroke-width="2.4" stroke-dasharray="8 6" marker-end="url(#a)"/><text x="1236" y="326.0" font-size="13" font-weight="600" fill="#16a34a" text-anchor="end">poll state</text><rect x="40" y="360" width="660" height="291" rx="10" fill="#ffffff" stroke="#9aa5b5" stroke-width="2"/><text x="54" y="389" font-size="17" font-weight="700" fill="#1f2937" text-anchor="start">Why this shape</text><text x="54" y="415.0" font-size="15" font-weight="400" fill="#1f2937" text-anchor="start">• keeps the frozen v1 contract and its 1,390 Tcl contract tests: nothing is</text><text x="54" y="435.25" font-size="15" font-weight="400" fill="#1f2937" text-anchor="start">   rewritten</text><text x="54" y="455.5" font-size="15" font-weight="400" fill="#1f2937" text-anchor="start">• the relay has no write path, so a bug there cannot change a program or a</text><text x="54" y="475.75" font-size="15" font-weight="400" fill="#1f2937" text-anchor="start">   device</text><text x="54" y="496.0" font-size="15" font-weight="400" fill="#1f2937" text-anchor="start">• the CCU's own session and privilege model stays the single source of</text><text x="54" y="516.25" font-size="15" font-weight="400" fill="#1f2937" text-anchor="start">   truth (a ticket, not a second login)</text><text x="54" y="536.5" font-size="15" font-weight="400" fill="#1f2937" text-anchor="start">• optional: a CCU without the relay works exactly as today</text><text x="54" y="556.75" font-size="15" font-weight="400" fill="#1f2937" text-anchor="start">• written from scratch (Apache-2.0); no code or protocol taken from MUI</text><text x="54" y="577.0" font-size="15" font-weight="400" fill="#1f2937" text-anchor="start">   (AGPL)</text><text x="54" y="597.25" font-size="15" font-weight="400" fill="#1f2937" text-anchor="start">• language open: Go (static ARM binary, like MUI) or C++ / Tcl (already in</text><text x="54" y="617.5" font-size="15" font-weight="400" fill="#1f2937" text-anchor="start">   the build, as the modernizer suggested)</text><rect x="40" y="816" width="26" height="18" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="74" y="830" font-size="13" font-weight="500" fill="#5b6472" text-anchor="start">browser</text><rect x="150.4" y="816" width="26" height="18" rx="4" fill="#e5e7eb" stroke="#6b7280" stroke-width="2"/><text x="184.4" y="830" font-size="13" font-weight="500" fill="#5b6472" text-anchor="start">web server</text><rect x="282.4" y="816" width="26" height="18" rx="4" fill="#fef3c7" stroke="#d97706" stroke-width="2"/><text x="316.4" y="830" font-size="13" font-weight="500" fill="#5b6472" text-anchor="start">per-request Tcl</text><rect x="450.4" y="816" width="26" height="18" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="2" stroke-dasharray="6 4"/><text x="484.4" y="830" font-size="13" font-weight="500" fill="#5b6472" text-anchor="start">optional persistent process</text><rect x="704.8" y="816" width="26" height="18" rx="4" fill="#f1f5f9" stroke="#475569" stroke-width="2"/><text x="738.8" y="830" font-size="13" font-weight="500" fill="#5b6472" text-anchor="start">closed source / native</text><text x="40" y="869" font-size="12.5" font-weight="400" fill="#5b6472" text-anchor="start">This is the 'optional gateway, gated' of the modernizer (.migration/webui-api/architect/target-architecture.adr.md), narrowed to push only. Not built; the ticket step and the XML-RPC callbacks are</text><text x="40" y="886" font-size="12.5" font-weight="400" fill="#5b6472" text-anchor="start">untested ideas.</text></svg>
