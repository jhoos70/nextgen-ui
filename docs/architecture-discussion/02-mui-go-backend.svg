<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family='Inter, "Segoe UI", Helvetica, Arial, sans-serif'><defs><marker id="a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker></defs><rect width="1600" height="900" fill="#ffffff"/><text x="40" y="52" font-size="30" font-weight="700" fill="#1f2937">2  MUI: a persistent Go backend</text><text x="40" y="82" font-size="16" fill="#5b6472">Own daemon beside the web server: one WebSocket per browser, its own protocol, sessions and system services.</text><rect x="40" y="120" width="300" height="231" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="54" y="149" font-size="17" font-weight="700" fill="#1f2937" text-anchor="start">MUI front end (React PWA)</text><text x="54" y="175.0" font-size="15" font-weight="400" fill="#1f2937" text-anchor="start">• installable, service worker</text><text x="54" y="195.25" font-size="15" font-weight="400" fill="#1f2937" text-anchor="start">   (workbox)</text><text x="54" y="215.5" font-size="15" font-weight="400" fill="#1f2937" text-anchor="start">• 259 lazily loaded assets (248</text><text x="54" y="235.75" font-size="15" font-weight="400" fill="#1f2937" text-anchor="start">   gzipped)</text><text x="54" y="256.0" font-size="15" font-weight="400" fill="#1f2937" text-anchor="start">• German first</text><text x="54" y="276.25" font-size="15" font-weight="400" fill="#1f2937" text-anchor="start">• talks ONLY to the Go daemon,</text><text x="54" y="296.5" font-size="15" font-weight="400" fill="#1f2937" text-anchor="start">   by WebSocket</text><text x="54" y="316.75" font-size="15" font-weight="400" fill="#1f2937" text-anchor="start">• Web Push notifications</text><rect x="410" y="120" width="300" height="271" rx="10" fill="#e5e7eb" stroke="#6b7280" stroke-width="2"/><text x="424" y="149" font-size="17" font-weight="700" fill="#1f2937" text-anchor="start">lighttpd</text><text x="424" y="175.0" font-size="15" font-weight="400" fill="#1f2937" text-anchor="start">• /addons/mui/*  static files</text><text x="424" y="195.25" font-size="15" font-weight="400" fill="#1f2937" text-anchor="start">• /addons/mui/ws  proxied to</text><text x="424" y="215.5" font-size="15" font-weight="400" fill="#1f2937" text-anchor="start">   127.0.0.1:8088 with Upgrade</text><text x="424" y="235.75" font-size="15" font-weight="400" fill="#1f2937" text-anchor="start">   (mod_proxy)</text><text x="424" y="256.0" font-size="15" font-weight="400" fill="#1f2937" text-anchor="start">• config in /usr/local/etc/confi</text><text x="424" y="276.25" font-size="15" font-weight="400" fill="#1f2937" text-anchor="start">   g/lighttpd/mui.conf (writable,</text><text x="424" y="296.5" font-size="15" font-weight="400" fill="#1f2937" text-anchor="start">   survives updates)</text><text x="424" y="316.75" font-size="15" font-weight="400" fill="#1f2937" text-anchor="start">• add-on installed through the</text><text x="424" y="337.0" font-size="15" font-weight="400" fill="#1f2937" text-anchor="start">   CCU's 'Additional software'</text><text x="424" y="357.25" font-size="15" font-weight="400" fill="#1f2937" text-anchor="start">   page</text><rect x="790" y="120" width="520" height="722" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="804" y="149" font-size="17" font-weight="700" fill="#1f2937" text-anchor="start">ccu-addon-mui-server (Go, static ARM, 10 MB)</text><rect x="808" y="164" width="484" height="104" rx="8" fill="#ffffff" stroke="#9aa5b5" stroke-width="2"/><text x="822" y="191.5" font-size="15.5" font-weight="700" fill="#1f2937" text-anchor="start">WebSocket hub</text><text x="822" y="216.3" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start">JSON messages: getProgram, saveRule, setDatapoint,</text><text x="822" y="235.20000000000002" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start">subscribePush, getHistory ...</text><rect x="808" y="276" width="484" height="123" rx="8" fill="#ffffff" stroke="#9aa5b5" stroke-width="2"/><text x="822" y="303.5" font-size="15.5" font-weight="700" fill="#1f2937" text-anchor="start">Own sessions and audit</text><text x="822" y="328.3" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start">mui-sessions.json, mui-auth.key, audit log; AUTH_MODE =</text><text x="822" y="347.2" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start">ccu or none (none: everyone on the network can control all</text><text x="822" y="366.1" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start">devices)</text><rect x="808" y="407" width="484" height="104" rx="8" fill="#ffffff" stroke="#9aa5b5" stroke-width="2"/><text x="822" y="434.5" font-size="15.5" font-weight="700" fill="#1f2937" text-anchor="start">Interface clients</text><text x="822" y="459.3" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start">XML-RPC client + callback server: events are PUSHED in;</text><text x="822" y="478.2" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start">seen connected: local ports 32001, 32010</text><rect x="808" y="519" width="484" height="104" rx="8" fill="#ffffff" stroke="#9aa5b5" stroke-width="2"/><text x="822" y="546.5" font-size="15.5" font-weight="700" fill="#1f2937" text-anchor="start">ReGa access</text><text x="822" y="571.3" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start">builds ReGa scripts in Go (string formatting) and runs</text><text x="822" y="590.1999999999999" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start">them: programs, rules, system variables, rooms</text><rect x="808" y="631" width="484" height="104" rx="8" fill="#ffffff" stroke="#9aa5b5" stroke-width="2"/><text x="822" y="658.5" font-size="15.5" font-weight="700" fill="#1f2937" text-anchor="start">System services</text><text x="822" y="683.3" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start">backups, firmware, certificates, network, reboot, add-on</text><text x="822" y="702.1999999999999" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start">self-update</text><rect x="808" y="743" width="484" height="85" rx="8" fill="#ffffff" stroke="#9aa5b5" stroke-width="2"/><text x="822" y="770.5" font-size="15.5" font-weight="700" fill="#1f2937" text-anchor="start">Web Push (VAPID)</text><text x="822" y="795.3" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start">sends notifications when the tab is closed</text><rect x="1390" y="120" width="170" height="129" rx="10" fill="#f1f5f9" stroke="#475569" stroke-width="2"/><text x="1404" y="149" font-size="17" font-weight="700" fill="#1f2937" text-anchor="start">ReGaHss</text><text x="1404" y="175.0" font-size="15" font-weight="400" fill="#1f2937" text-anchor="start">closed source</text><text x="1404" y="195.25" font-size="15" font-weight="400" fill="#1f2937" text-anchor="start">programs,</text><text x="1404" y="215.5" font-size="15" font-weight="400" fill="#1f2937" text-anchor="start">sysvars</text><rect x="1390" y="270" width="170" height="109" rx="10" fill="#f1f5f9" stroke="#475569" stroke-width="2"/><text x="1404" y="299" font-size="17" font-weight="700" fill="#1f2937" text-anchor="start">Interfaces</text><text x="1404" y="325.0" font-size="15" font-weight="400" fill="#1f2937" text-anchor="start">rfd, HmIPServer</text><text x="1404" y="345.25" font-size="15" font-weight="400" fill="#1f2937" text-anchor="start">XML-RPC</text><rect x="1390" y="420" width="170" height="129" rx="10" fill="#f1f5f9" stroke="#475569" stroke-width="2"/><text x="1404" y="449" font-size="17" font-weight="700" fill="#1f2937" text-anchor="start">Files / OS</text><text x="1404" y="475.0" font-size="15" font-weight="400" fill="#1f2937" text-anchor="start">backup,</text><text x="1404" y="495.25" font-size="15" font-weight="400" fill="#1f2937" text-anchor="start">firmware,</text><text x="1404" y="515.5" font-size="15" font-weight="400" fill="#1f2937" text-anchor="start">certificates</text><line x1="340" y1="220" x2="410" y2="220" stroke="#374151" stroke-width="2.4" marker-end="url(#a)" marker-start="url(#a)"/><text x="375" y="198.0" font-size="13" font-weight="600" fill="#374151" text-anchor="middle">WSS</text><line x1="710" y1="220" x2="790" y2="220" stroke="#374151" stroke-width="2.4" marker-end="url(#a)" marker-start="url(#a)"/><text x="750" y="198.0" font-size="13" font-weight="600" fill="#374151" text-anchor="middle">proxy</text><line x1="1310" y1="180" x2="1390" y2="180" stroke="#374151" stroke-width="2.4" marker-end="url(#a)"/><text x="1350" y="158.0" font-size="13" font-weight="600" fill="#374151" text-anchor="middle">scripts</text><line x1="1310" y1="320" x2="1390" y2="320" stroke="#374151" stroke-width="2.4" marker-end="url(#a)" marker-start="url(#a)"/><text x="1350" y="270.0" font-size="13" font-weight="600" fill="#374151" text-anchor="middle">XML-RPC</text><text x="1350" y="286.9" font-size="13" font-weight="600" fill="#374151" text-anchor="middle">+ events</text><line x1="1310" y1="460" x2="1390" y2="460" stroke="#374151" stroke-width="2.4" marker-end="url(#a)"/><rect x="40" y="400" width="670" height="190" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="54" y="429" font-size="17" font-weight="700" fill="#1f2937" text-anchor="start">Measured on the test CCU (Pi 4)</text><text x="54" y="455.0" font-size="15" font-weight="400" fill="#1f2937" text-anchor="start">• running for 146 h without a restart</text><text x="54" y="475.25" font-size="15" font-weight="400" fill="#1f2937" text-anchor="start">• resident memory 20 MB, 12 threads (virtual size 577 MB is address space</text><text x="54" y="495.5" font-size="15" font-weight="400" fill="#1f2937" text-anchor="start">   only)</text><text x="54" y="515.75" font-size="15" font-weight="400" fill="#1f2937" text-anchor="start">• CPU: 4047 s in 146 h = 0.77 % of ONE core on average</text><text x="54" y="536.0" font-size="15" font-weight="400" fill="#1f2937" text-anchor="start">• 10 MB binary, cross-compiled per architecture</text><text x="54" y="556.25" font-size="15" font-weight="400" fill="#1f2937" text-anchor="start">• AGPL-3.0 (see slide 4)</text><rect x="40" y="816" width="26" height="18" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="74" y="830" font-size="13" font-weight="500" fill="#5b6472" text-anchor="start">browser</text><rect x="150.4" y="816" width="26" height="18" rx="4" fill="#e5e7eb" stroke="#6b7280" stroke-width="2"/><text x="184.4" y="830" font-size="13" font-weight="500" fill="#5b6472" text-anchor="start">web server</text><rect x="282.4" y="816" width="26" height="18" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="316.4" y="830" font-size="13" font-weight="500" fill="#5b6472" text-anchor="start">persistent Go process</text><rect x="493.6" y="816" width="26" height="18" rx="4" fill="#f1f5f9" stroke="#475569" stroke-width="2"/><text x="527.6" y="830" font-size="13" font-weight="500" fill="#5b6472" text-anchor="start">closed source / native</text><text x="40" y="869" font-size="12.5" font-weight="400" fill="#5b6472" text-anchor="start">Sources: read-only inspection of /usr/local/addons/mui on the test CCU, its rc.d script, process list, open sockets and the text inside the binary (names of messages, environment variables, ports).</text><text x="40" y="886" font-size="12.5" font-weight="400" fill="#5b6472" text-anchor="start">Source code not reviewed.</text></svg>
