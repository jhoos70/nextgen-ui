<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family='Inter, "Segoe UI", Helvetica, Arial, sans-serif'><defs><marker id="a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker></defs><rect width="1600" height="900" fill="#ffffff"/><text x="40" y="52" font-size="30" font-weight="700" fill="#1f2937">1  Today: the nextGen UI inside the CCU's own stack</text><text x="40" y="82" font-size="16" fill="#5b6472">Refactor in place: static React app + Tcl CGI routes (/api/homematic.cgi/v2) + the existing bridges. No extra process.</text><rect x="40" y="120" width="300" height="150" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="54" y="149" font-size="17" font-weight="700" fill="#1f2937" text-anchor="start">Classic WebUI</text><text x="54" y="175.0" font-size="15" font-weight="400" fill="#1f2937" text-anchor="start">served at /</text><text x="54" y="195.25" font-size="15" font-weight="400" fill="#1f2937" text-anchor="start">webui.js, ReGa pages (.htm /</text><text x="54" y="215.5" font-size="15" font-weight="400" fill="#1f2937" text-anchor="start">.esp)</text><text x="54" y="235.75" font-size="15" font-weight="400" fill="#1f2937" text-anchor="start">unchanged, stays long-term</text><rect x="40" y="294" width="300" height="251" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="54" y="323" font-size="17" font-weight="700" fill="#1f2937" text-anchor="start">nextGen UI (this repo)</text><text x="54" y="349.0" font-size="15" font-weight="400" fill="#1f2937" text-anchor="start">• React 19, Vite, Tailwind 4,</text><text x="54" y="369.25" font-size="15" font-weight="400" fill="#1f2937" text-anchor="start">   shadcn / Radix</text><text x="54" y="389.5" font-size="15" font-weight="400" fill="#1f2937" text-anchor="start">• one 718 kB bundle (203 kB</text><text x="54" y="409.75" font-size="15" font-weight="400" fill="#1f2937" text-anchor="start">   gzipped)</text><text x="54" y="430.0" font-size="15" font-weight="400" fill="#1f2937" text-anchor="start">• at /webui/next/, EN / DE</text><text x="54" y="450.25" font-size="15" font-weight="400" fill="#1f2937" text-anchor="start">• session id in X-Session-Id</text><text x="54" y="470.5" font-size="15" font-weight="400" fill="#1f2937" text-anchor="start">   header</text><text x="54" y="490.75" font-size="15" font-weight="400" fill="#1f2937" text-anchor="start">• data by polling, 10 s per list</text><text x="54" y="511.0" font-size="15" font-weight="400" fill="#1f2937" text-anchor="start">• no service worker, no push</text><rect x="410" y="120" width="330" height="271" rx="10" fill="#e5e7eb" stroke="#6b7280" stroke-width="2"/><text x="424" y="149" font-size="17" font-weight="700" fill="#1f2937" text-anchor="start">lighttpd 1.4.84</text><text x="424" y="175.0" font-size="15" font-weight="400" fill="#1f2937" text-anchor="start">mod_cgi, mod_proxy, mod_authn_rega</text><text x="424" y="195.25" font-size="15" font-weight="400" fill="#1f2937" text-anchor="start">• /webui/next/*  static files, about</text><text x="424" y="215.5" font-size="15" font-weight="400" fill="#1f2937" text-anchor="start">   5 ms per request (measured)</text><text x="424" y="235.75" font-size="15" font-weight="400" fill="#1f2937" text-anchor="start">• /api/homematic.cgi  v1 JSON-RPC,</text><text x="424" y="256.0" font-size="15" font-weight="400" fill="#1f2937" text-anchor="start">   frozen contract, 180 methods</text><text x="424" y="276.25" font-size="15" font-weight="400" fill="#1f2937" text-anchor="start">• /api/homematic.cgi/v2/*  nextGen</text><text x="424" y="296.5" font-size="15" font-weight="400" fill="#1f2937" text-anchor="start">   routes: model, values, programs</text><text x="424" y="316.75" font-size="15" font-weight="400" fill="#1f2937" text-anchor="start">   (incl. editor), sysvars,</text><text x="424" y="337.0" font-size="15" font-weight="400" fill="#1f2937" text-anchor="start">   favourites, messages, log,</text><text x="424" y="357.25" font-size="15" font-weight="400" fill="#1f2937" text-anchor="start">   profile, system, events</text><rect x="830" y="120" width="380" height="332" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/><text x="844" y="149" font-size="17" font-weight="700" fill="#1f2937" text-anchor="start">One tclsh process PER REQUEST</text><text x="844" y="175.0" font-size="15" font-weight="400" fill="#1f2937" text-anchor="start">about 80 ms for the cheapest request</text><text x="844" y="195.25" font-size="15" font-weight="400" fill="#1f2937" text-anchor="start">(measured: process start + session check)</text><text x="844" y="215.5" font-size="15" font-weight="400" fill="#1f2937" text-anchor="start">• dispatcher with privilege levels 0 / 1 /</text><text x="844" y="235.75" font-size="15" font-weight="400" fill="#1f2937" text-anchor="start">   2 / 8</text><text x="844" y="256.0" font-size="15" font-weight="400" fill="#1f2937" text-anchor="start">• v1: 183 method scripts in 19 namespaces</text><text x="844" y="276.25" font-size="15" font-weight="400" fill="#1f2937" text-anchor="start">• v2: JSON handlers, strict validation</text><text x="844" y="296.5" font-size="15" font-weight="400" fill="#1f2937" text-anchor="start">• ReGa scripts are FIXED text; values are</text><text x="844" y="316.75" font-size="15" font-weight="400" fill="#1f2937" text-anchor="start">   bound as variables, never code</text><text x="844" y="337.0" font-size="15" font-weight="400" fill="#1f2937" text-anchor="start">• structure changes run on a working copy</text><text x="844" y="357.25" font-size="15" font-weight="400" fill="#1f2937" text-anchor="start">   that is put back in one step</text><text x="844" y="377.5" font-size="15" font-weight="400" fill="#1f2937" text-anchor="start">• event queue: files in /tmp/event, filled</text><text x="844" y="397.75" font-size="15" font-weight="400" fill="#1f2937" text-anchor="start">   only by API code; the long-poll route</text><text x="844" y="418.0" font-size="15" font-weight="400" fill="#1f2937" text-anchor="start">   /events exists, the UI does not use it</text><rect x="1290" y="120" width="270" height="150" rx="10" fill="#f1f5f9" stroke="#475569" stroke-width="2"/><text x="1304" y="149" font-size="17" font-weight="700" fill="#1f2937" text-anchor="start">ReGaHss (closed source)</text><text x="1304" y="175.0" font-size="15" font-weight="400" fill="#1f2937" text-anchor="start">script engine, object model</text><text x="1304" y="195.25" font-size="15" font-weight="400" fill="#1f2937" text-anchor="start">programs, rooms, system</text><text x="1304" y="215.5" font-size="15" font-weight="400" fill="#1f2937" text-anchor="start">variables</text><text x="1304" y="235.75" font-size="15" font-weight="400" fill="#1f2937" text-anchor="start">session store</text><rect x="1290" y="335" width="270" height="150" rx="10" fill="#f1f5f9" stroke="#475569" stroke-width="2"/><text x="1304" y="364" font-size="17" font-weight="700" fill="#1f2937" text-anchor="start">Interface processes</text><text x="1304" y="390.0" font-size="15" font-weight="400" fill="#1f2937" text-anchor="start">rfd (BidCos-RF), HmIPServer,</text><text x="1304" y="410.25" font-size="15" font-weight="400" fill="#1f2937" text-anchor="start">hs485d</text><text x="1304" y="430.5" font-size="15" font-weight="400" fill="#1f2937" text-anchor="start">XML-RPC</text><text x="1304" y="450.75" font-size="15" font-weight="400" fill="#1f2937" text-anchor="start">devices, radio modules</text><line x1="340" y1="350" x2="410" y2="350" stroke="#374151" stroke-width="2.4" marker-end="url(#a)" marker-start="url(#a)"/><text x="375" y="314.0" font-size="13" font-weight="600" fill="#374151" text-anchor="middle">HTTP</text><text x="375" y="330.9" font-size="13" font-weight="600" fill="#374151" text-anchor="middle">JSON</text><line x1="740" y1="230" x2="830" y2="230" stroke="#374151" stroke-width="2.4" marker-end="url(#a)"/><text x="785" y="216.0" font-size="13" font-weight="600" fill="#374151" text-anchor="middle">CGI spawn</text><line x1="1210" y1="190" x2="1290" y2="190" stroke="#374151" stroke-width="2.4" marker-end="url(#a)"/><text x="1250" y="168.0" font-size="13" font-weight="600" fill="#374151" text-anchor="middle">tclrega.so</text><line x1="1210" y1="410" x2="1290" y2="410" stroke="#374151" stroke-width="2.4" marker-end="url(#a)"/><text x="1250" y="388.0" font-size="13" font-weight="600" fill="#374151" text-anchor="middle">tclrpc.so</text><line x1="1425" y1="335" x2="1425" y2="295" stroke="#dc2626" stroke-width="2.4" stroke-dasharray="8 6" marker-end="url(#a)"/><text x="1412" y="312" font-size="12.5" font-weight="600" fill="#dc2626" text-anchor="end">device events reach ReGa,</text><text x="1412" y="328" font-size="12.5" font-weight="600" fill="#dc2626" text-anchor="end">not the browser</text><rect x="410" y="585" width="1150" height="150" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/><text x="424" y="614" font-size="17" font-weight="700" fill="#1f2937" text-anchor="start">What this stack cannot do on its own</text><text x="424" y="640.0" font-size="15" font-weight="400" fill="#1f2937" text-anchor="start">• push: datapoint changes reach ReGa, but nothing sends them to the browser; the UI polls every 10 s (each poll = one process start +</text><text x="424" y="660.25" font-size="15" font-weight="400" fill="#1f2937" text-anchor="start">   one ReGa script)</text><text x="424" y="680.5" font-size="15" font-weight="400" fill="#1f2937" text-anchor="start">• a persistent process (cache, held session, XML-RPC callbacks, WebSocket) does not fit a CGI; the modernizer left it as an optional,</text><text x="424" y="700.75" font-size="15" font-weight="400" fill="#1f2937" text-anchor="start">   gated gateway</text><rect x="40" y="816" width="26" height="18" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="74" y="830" font-size="13" font-weight="500" fill="#5b6472" text-anchor="start">browser</text><rect x="150.4" y="816" width="26" height="18" rx="4" fill="#e5e7eb" stroke="#6b7280" stroke-width="2"/><text x="184.4" y="830" font-size="13" font-weight="500" fill="#5b6472" text-anchor="start">web server</text><rect x="282.4" y="816" width="26" height="18" rx="4" fill="#fef3c7" stroke="#d97706" stroke-width="2"/><text x="316.4" y="830" font-size="13" font-weight="500" fill="#5b6472" text-anchor="start">per-request Tcl</text><rect x="450.4" y="816" width="26" height="18" rx="4" fill="#f1f5f9" stroke="#475569" stroke-width="2"/><text x="484.4" y="830" font-size="13" font-weight="500" fill="#5b6472" text-anchor="start">closed source / native</text><rect x="668.8" y="816" width="26" height="18" rx="4" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/><text x="702.8" y="830" font-size="13" font-weight="500" fill="#5b6472" text-anchor="start">limit</text><text x="40" y="869" font-size="12.5" font-weight="400" fill="#5b6472" text-anchor="start">Sources: .migration/webui-api/architect/target-architecture.md; code in src/webui/www/api/v2. Measured on the test CCU (Raspberry Pi 4, 4 cores, 3.8 GB, load 0.16): 12 requests each, medians 80 ms</text><text x="40" y="886" font-size="12.5" font-weight="400" fill="#5b6472" text-anchor="start">(CGI path, no ReGa script) and 5 ms (static).</text></svg>
