<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family='Inter, "Segoe UI", Helvetica, Arial, sans-serif'><defs><marker id="a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker></defs><rect width="1600" height="900" fill="#ffffff"/><text x="40" y="52" font-size="30" font-weight="700" fill="#1f2937">7  Coupling to upstream: what the merge of 2026-11-08 cost</text><text x="40" y="82" font-size="16" fill="#5b6472">Merging 103 upstream commits (3 weeks) into nextgen-ui. The React app was not the problem; the server-side changes inside upstream's tree and the tests that pin them were.</text><rect x="40" y="118" width="480" height="413" rx="10" fill="#ffffff" stroke="#9aa5b5" stroke-width="2"/><text x="54" y="147" font-size="17" font-weight="700" fill="#1f2937" text-anchor="start">Measured on this merge</text><text x="54" y="173.0" font-size="15" font-weight="400" fill="#1f2937" text-anchor="start">• nextGen app: 114 files in its own folder: 0</text><text x="54" y="193.25" font-size="15" font-weight="400" fill="#1f2937" text-anchor="start">   conflicts, 1 line changed (a nav entry for a new</text><text x="54" y="213.5" font-size="15" font-weight="400" fill="#1f2937" text-anchor="start">   classic menu item)</text><text x="54" y="233.75" font-size="15" font-weight="400" fill="#1f2937" text-anchor="start">• our server-side code inside upstream's tree: 106</text><text x="54" y="254.0" font-size="15" font-weight="400" fill="#1f2937" text-anchor="start">   files (80 changed, 26 added; 58 are v1 method</text><text x="54" y="274.25" font-size="15" font-weight="400" fill="#1f2937" text-anchor="start">   scripts); 5 of them were also changed by upstream</text><text x="54" y="294.5" font-size="15" font-weight="400" fill="#1f2937" text-anchor="start">• text conflicts: 3 hmipserver methods + README; 2</text><text x="54" y="314.75" font-size="15" font-weight="400" fill="#1f2937" text-anchor="start">   more files merged on their own but changed behaviour</text><text x="54" y="335.0" font-size="15" font-weight="400" fill="#1f2937" text-anchor="start">• follow-up edits: about 30 files, nearly all tests,</text><text x="54" y="355.25" font-size="15" font-weight="400" fill="#1f2937" text-anchor="start">   the method schema and notes (counts, new fields,</text><text x="54" y="375.5" font-size="15" font-weight="400" fill="#1f2937" text-anchor="start">   removed method)</text><text x="54" y="395.75" font-size="15" font-weight="400" fill="#1f2937" text-anchor="start">• the sibling OpenCCU patches: 11 of 13 no longer</text><text x="54" y="416.0" font-size="15" font-weight="400" fill="#1f2937" text-anchor="start">   apply to the merged tree; 7 of them are now part of</text><text x="54" y="436.25" font-size="15" font-weight="400" fill="#1f2937" text-anchor="start">   Base</text><text x="54" y="456.5" font-size="15" font-weight="400" fill="#1f2937" text-anchor="start">• found afterwards: the CCU3 answered 'method not</text><text x="54" y="476.75" font-size="15" font-weight="400" fill="#1f2937" text-anchor="start">   found' for 4 methods of its own classic UI, because</text><text x="54" y="497.0" font-size="15" font-weight="400" fill="#1f2937" text-anchor="start">   we shipped methods.conf as a whole file</text><text x="560" y="136" font-size="17" font-weight="700" fill="#1f2937">Three kinds of coupling in option A</text><rect x="560" y="152" width="470" height="104" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/><text x="574" y="180" font-size="16" font-weight="700" fill="#1f2937" text-anchor="start">Textual</text><text x="574" y="204.8" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start">we edit files that upstream also edits (methods.conf,</text><text x="574" y="223.70000000000002" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start">the hmipserver methods, getpositiondata)</text><rect x="560" y="266" width="470" height="104" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/><text x="574" y="294" font-size="16" font-weight="700" fill="#1f2937" text-anchor="start">Contract</text><text x="574" y="318.8" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start">our tests pin upstream's behaviour: method counts,</text><text x="574" y="337.7" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start">output fields, which channels are returned</text><rect x="560" y="380" width="470" height="104" rx="10" fill="#f1f5f9" stroke="#475569" stroke-width="2"/><text x="574" y="408" font-size="16" font-weight="700" fill="#1f2937" text-anchor="start">Deployment</text><text x="574" y="432.8" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start">the bundle overwrites files in /www of a device whose</text><text x="574" y="451.7" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start">firmware has its own versions</text><text x="1060" y="136" font-size="17" font-weight="700" fill="#1f2937">MUI, for comparison (inspected, source not read)</text><rect x="1060" y="152" width="500" height="236" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="1074" y="180" font-size="16" font-weight="700" fill="#1f2937" text-anchor="start">No merge, other ways to lag</text><text x="1074" y="204.8" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start">• separate add-on in its own repo: nothing of it inside</text><text x="1074" y="223.70000000000002" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start">   upstream's tree</text><text x="1074" y="242.60000000000002" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start">• imports upstream data by 3 build scripts (link profiles,</text><text x="1074" y="261.5" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start">   parameter labels, service-message texts)</text><text x="1074" y="280.40000000000003" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start">• re-implements classic behaviour in Go ('as cp_time.cgi</text><text x="1074" y="299.3" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start">   does'): when upstream changes it, nothing fails, MUI just</text><text x="1074" y="318.20000000000005" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start">   differs</text><text x="1074" y="337.1" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start">• reads firmware internals (files, CGIs) at runtime: a</text><text x="1074" y="356.0" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start">   firmware change breaks it there, not at merge time</text><rect x="40" y="555" width="1520" height="146" rx="10" fill="#fef9c3" stroke="#ca8a04" stroke-width="2"/><text x="54" y="584" font-size="17" font-weight="700" fill="#1f2937" text-anchor="start">Reading (opinion, nothing decided)</text><text x="54" y="609.4" font-size="14.5" font-weight="400" fill="#1f2937" text-anchor="start">• the friction belongs to 'refactor in place' of v1 (the modernizer's choice), not to React or to the nextGen UI: a Go backend would swap loud merge cost for silent drift</text><text x="54" y="628.975" font-size="14.5" font-weight="400" fill="#1f2937" text-anchor="start">• it is reducible: apply our methods.conf entries one by one instead of replacing the file, offer the hardening upstream, derive test counts from the registry, merge upstream weekly</text><text x="54" y="648.55" font-size="14.5" font-weight="400" fill="#1f2937" text-anchor="start">   (smaller steps, earlier signal)</text><text x="54" y="668.125" font-size="14.5" font-weight="400" fill="#1f2937" text-anchor="start">• as a criterion for the decision: where does each option put its code relative to upstream, and what does one upstream week cost?</text><rect x="40" y="816" width="26" height="18" rx="4" fill="#ffffff" stroke="#9aa5b5" stroke-width="2"/><text x="74" y="830" font-size="13" font-weight="500" fill="#5b6472" text-anchor="start">measured here</text><rect x="193.60000000000002" y="816" width="26" height="18" rx="4" fill="#fef3c7" stroke="#d97706" stroke-width="2"/><text x="227.60000000000002" y="830" font-size="13" font-weight="500" fill="#5b6472" text-anchor="start">textual</text><rect x="304.0" y="816" width="26" height="18" rx="4" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/><text x="338.0" y="830" font-size="13" font-weight="500" fill="#5b6472" text-anchor="start">contract</text><rect x="421.6" y="816" width="26" height="18" rx="4" fill="#f1f5f9" stroke="#475569" stroke-width="2"/><text x="455.6" y="830" font-size="13" font-weight="500" fill="#5b6472" text-anchor="start">deployment</text><rect x="553.6" y="816" width="26" height="18" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="587.6" y="830" font-size="13" font-weight="500" fill="#5b6472" text-anchor="start">MUI</text><rect x="635.2" y="816" width="26" height="18" rx="4" fill="#fef9c3" stroke="#ca8a04" stroke-width="2"/><text x="669.2" y="830" font-size="13" font-weight="500" fill="#5b6472" text-anchor="start">opinion</text><text x="40" y="869" font-size="12.5" font-weight="400" fill="#5b6472" text-anchor="start">Sources: git history of the merge 021069d8 (diff against both parents), PATCH-CONFLICTS.md, the install check on the test CCU of 2026-11-08, MUI's THIRD_PARTY_LICENSES.md and the text inside its</text><text x="40" y="886" font-size="12.5" font-weight="400" fill="#5b6472" text-anchor="start">binary.</text></svg>
