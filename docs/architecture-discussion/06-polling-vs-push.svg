<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family='Inter, "Segoe UI", Helvetica, Arial, sans-serif'><defs><marker id="a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker></defs><rect width="1600" height="900" fill="#ffffff"/><text x="40" y="52" font-size="30" font-weight="700" fill="#1f2937">6  Why live updates are the real gap: polling vs push</text><text x="40" y="82" font-size="16" fill="#5b6472">Same screen, same data: what the CCU does for it.</text><rect x="40" y="120" width="1520" height="290" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/><text x="54" y="149" font-size="17" font-weight="700" fill="#1f2937" text-anchor="start">Polling (today): every 10 s, per list and per open tab</text><rect x="80" y="170" width="240" height="116" rx="10" fill="#ffffff" stroke="#9aa5b5" stroke-width="2"/><text x="94" y="196.5" font-size="14.5" font-weight="700" fill="#1f2937" text-anchor="start">t = 0 s</text><text x="94" y="220.1" font-size="13" font-weight="400" fill="#1f2937" text-anchor="start">process start (about 80 ms)</text><text x="94" y="237.65" font-size="13" font-weight="400" fill="#1f2937" text-anchor="start">+ one ReGa script</text><text x="94" y="255.2" font-size="13" font-weight="400" fill="#1f2937" text-anchor="start">= an answer, often unchanged</text><line x1="320" y1="215" x2="380" y2="215" stroke="#d97706" stroke-width="2.4" marker-end="url(#a)"/><text x="350" y="198.0" font-size="12.5" font-weight="600" fill="#d97706" text-anchor="middle">+10 s</text><rect x="380" y="170" width="240" height="116" rx="10" fill="#ffffff" stroke="#9aa5b5" stroke-width="2"/><text x="394" y="196.5" font-size="14.5" font-weight="700" fill="#1f2937" text-anchor="start">t = 10 s</text><text x="394" y="220.1" font-size="13" font-weight="400" fill="#1f2937" text-anchor="start">process start (about 80 ms)</text><text x="394" y="237.65" font-size="13" font-weight="400" fill="#1f2937" text-anchor="start">+ one ReGa script</text><text x="394" y="255.2" font-size="13" font-weight="400" fill="#1f2937" text-anchor="start">= an answer, often unchanged</text><line x1="620" y1="215" x2="680" y2="215" stroke="#d97706" stroke-width="2.4" marker-end="url(#a)"/><text x="650" y="198.0" font-size="12.5" font-weight="600" fill="#d97706" text-anchor="middle">+10 s</text><rect x="680" y="170" width="240" height="116" rx="10" fill="#ffffff" stroke="#9aa5b5" stroke-width="2"/><text x="694" y="196.5" font-size="14.5" font-weight="700" fill="#1f2937" text-anchor="start">t = 20 s</text><text x="694" y="220.1" font-size="13" font-weight="400" fill="#1f2937" text-anchor="start">process start (about 80 ms)</text><text x="694" y="237.65" font-size="13" font-weight="400" fill="#1f2937" text-anchor="start">+ one ReGa script</text><text x="694" y="255.2" font-size="13" font-weight="400" fill="#1f2937" text-anchor="start">= an answer, often unchanged</text><line x1="920" y1="215" x2="980" y2="215" stroke="#d97706" stroke-width="2.4" marker-end="url(#a)"/><text x="950" y="198.0" font-size="12.5" font-weight="600" fill="#d97706" text-anchor="middle">+10 s</text><rect x="980" y="170" width="240" height="116" rx="10" fill="#ffffff" stroke="#9aa5b5" stroke-width="2"/><text x="994" y="196.5" font-size="14.5" font-weight="700" fill="#1f2937" text-anchor="start">t = 30 s</text><text x="994" y="220.1" font-size="13" font-weight="400" fill="#1f2937" text-anchor="start">process start (about 80 ms)</text><text x="994" y="237.65" font-size="13" font-weight="400" fill="#1f2937" text-anchor="start">+ one ReGa script</text><text x="994" y="255.2" font-size="13" font-weight="400" fill="#1f2937" text-anchor="start">= an answer, often unchanged</text><line x1="1220" y1="215" x2="1280" y2="215" stroke="#d97706" stroke-width="2.4" marker-end="url(#a)"/><text x="1250" y="198.0" font-size="12.5" font-weight="600" fill="#d97706" text-anchor="middle">+10 s</text><rect x="1280" y="170" width="240" height="116" rx="10" fill="#ffffff" stroke="#9aa5b5" stroke-width="2"/><text x="1294" y="196.5" font-size="14.5" font-weight="700" fill="#1f2937" text-anchor="start">t = 40 s</text><text x="1294" y="220.1" font-size="13" font-weight="400" fill="#1f2937" text-anchor="start">process start (about 80 ms)</text><text x="1294" y="237.65" font-size="13" font-weight="400" fill="#1f2937" text-anchor="start">+ one ReGa script</text><text x="1294" y="255.2" font-size="13" font-weight="400" fill="#1f2937" text-anchor="start">= an answer, often unchanged</text><text x="60" y="318.0" font-size="14.5" font-weight="400" fill="#1f2937" text-anchor="start">- every poll costs a process start plus a ReGa script, even when nothing changed</text><text x="60" y="339.75" font-size="14.5" font-weight="400" fill="#1f2937" text-anchor="start">- N tabs x M lists = N x M polls per 10 s; the screen is up to 10 s behind</text><text x="60" y="361.5" font-size="14.5" font-weight="400" fill="#1f2937" text-anchor="start">- the page already pauses polling while the tab is hidden (use-polled.ts)</text><rect x="40" y="440" width="1520" height="330" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2" stroke-dasharray="7 5"/><text x="54" y="469" font-size="17" font-weight="700" fill="#1f2937" text-anchor="start">Push (candidate relay): one open connection, an event only when something changed</text><rect x="80" y="495" width="260" height="81" rx="10" fill="#ffffff" stroke="#9aa5b5" stroke-width="2"/><text x="94" y="521.5" font-size="14.5" font-weight="700" fill="#1f2937" text-anchor="start">browser</text><text x="94" y="545.1" font-size="13" font-weight="400" fill="#1f2937" text-anchor="start">one SSE / WebSocket connection</text><rect x="560" y="495" width="300" height="99" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="574" y="521.5" font-size="14.5" font-weight="700" fill="#1f2937" text-anchor="start">relay</text><text x="574" y="545.1" font-size="13" font-weight="400" fill="#1f2937" text-anchor="start">receives XML-RPC events</text><text x="574" y="562.65" font-size="13" font-weight="400" fill="#1f2937" text-anchor="start">diffs ReGa state</text><rect x="1080" y="495" width="260" height="81" rx="10" fill="#f1f5f9" stroke="#475569" stroke-width="2"/><text x="1094" y="521.5" font-size="14.5" font-weight="700" fill="#1f2937" text-anchor="start">interfaces / ReGa</text><text x="1094" y="545.1" font-size="13" font-weight="400" fill="#1f2937" text-anchor="start">events, state</text><line x1="340" y1="530" x2="560" y2="530" stroke="#16a34a" stroke-width="2.4" marker-end="url(#a)"/><text x="450" y="510.0" font-size="13" font-weight="600" fill="#16a34a" text-anchor="middle">open once (ticket)</text><line x1="560" y1="566" x2="340" y2="566" stroke="#16a34a" stroke-width="2.4" stroke-dasharray="8 6" marker-end="url(#a)"/><text x="450" y="590.0" font-size="13" font-weight="600" fill="#16a34a" text-anchor="middle">event only on change</text><line x1="1080" y1="530" x2="860" y2="530" stroke="#16a34a" stroke-width="2.4" marker-end="url(#a)"/><text x="970" y="510.0" font-size="13" font-weight="600" fill="#16a34a" text-anchor="middle">callbacks</text><text x="60" y="660.0" font-size="14.5" font-weight="400" fill="#1f2937" text-anchor="start">- no process start per update; the screen follows within about a second</text><text x="60" y="681.75" font-size="14.5" font-weight="400" fill="#1f2937" text-anchor="start">- commands (switch, edit a program) stay on the tested v2 routes</text><text x="60" y="703.5" font-size="14.5" font-weight="400" fill="#1f2937" text-anchor="start">- costs a second process (MUI's equivalent on the Pi 4: 20 MB, 0.8 % of one core), a ticket step and its own tests</text><text x="40" y="886" font-size="12.5" font-weight="400" fill="#5b6472" text-anchor="start">Numbers: measured on the test CCU (Pi 4) on 2026-11-08. Polling interval and hidden-tab behaviour: src/webui/next/src/lib/use-polled.ts. The relay is a proposal, not built.</text></svg>
